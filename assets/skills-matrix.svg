<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" height="330">
  <defs>
    <linearGradient id="matrixGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#03050c" />
    </linearGradient>

    <linearGradient id="cardGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1932" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>

    <linearGradient id="cardGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e32" />
      <stop offset="100%" stop-color="#0a0618" />
    </linearGradient>

    <linearGradient id="cardGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071e19" />
      <stop offset="100%" stop-color="#030c0a" />
    </linearGradient>

    <linearGradient id="cardGradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240a20" />
      <stop offset="100%" stop-color="#10040e" />
    </linearGradient>

    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes badgePulseCyan {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
      }
      @keyframes badgePulsePurple {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #b827fc); }
      }
      @keyframes badgePulseGreen {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00ffb3); }
      }
      @keyframes badgePulsePink {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #ff007f); }
      }

      .pulse-cyan { animation: badgePulseCyan 3s ease-in-out infinite; }
      .pulse-purple { animation: badgePulsePurple 3s ease-in-out infinite 0.7s; }
      .pulse-green { animation: badgePulseGreen 3s ease-in-out infinite 1.4s; }
      .pulse-pink { animation: badgePulsePink 3s ease-in-out infinite 2.1s; }

      .chip-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      }
    </style>
  </defs>

  <!-- Enclosure -->
  <rect width="880" height="330" rx="14" fill="url(#matrixGlass)" stroke="#16294d" stroke-width="1.6" />

  <!-- Top Glass Bar -->
  <g class="chip-mono" font-size="11">
    <path d="M 0 14 C 0 6.26 6.26 0 14 0 L 866 0 C 873.74 0 880 6.26 880 14 L 880 38 L 0 38 Z" fill="#0c162e" stroke="#16294d" stroke-width="1" />
    
    <circle cx="28" cy="19" r="4.5" fill="#00f2fe" filter="url(#chipGlow)" />
    <text x="44" y="23" fill="#00f2fe" font-weight="700" letter-spacing="1">ENGINEERING ARSENAL // PRODUCTION-HARDENED TECH STACK</text>

    <text x="850" y="23" fill="#6c8ab8" text-anchor="end">TIER-1 ARCHITECTURE</text>
  </g>

  <!-- GRID: 4 Futuristic Glass Modules -->

  <!-- MODULE 01: Core Backend Engines (Cyan) -->
  <g transform="translate(24, 54)">
    <rect x="0" y="0" width="404" height="122" rx="10" fill="url(#cardGradCyan)" stroke="#00f2fe" stroke-width="1.2" class="pulse-cyan" />
    
    <!-- Module Header -->
    <text x="18" y="24" class="chip-mono" font-size="11" fill="#00f2fe" font-weight="800" letter-spacing="1">
      [01] CORE ENGINES &amp; DISTRIBUTED RUNTIMES
    </text>
    <line x1="18" y1="34" x2="386" y2="34" stroke="#14325a" stroke-width="1" />

    <!-- Chips Row -->
    <g transform="translate(18, 48)" class="chip-mono" font-size="10.5">
      <!-- Go -->
      <rect x="0" y="0" width="82" height="30" rx="6" fill="#0c1e3a" stroke="#00add8" stroke-width="1.2" />
      <circle cx="12" cy="15" r="3" fill="#00add8" filter="url(#chipGlow)" />
      <text x="24" y="19" fill="#ffffff" font-weight="700">Golang</text>

      <!-- Python -->
      <rect x="92" y="0" width="86" height="30" rx="6" fill="#0c1e3a" stroke="#3776ab" stroke-width="1.2" />
      <circle cx="104" cy="15" r="3" fill="#ffd43b" />
      <text x="116" y="19" fill="#ffffff" font-weight="700">Python</text>

      <!-- Rust -->
      <rect x="188" y="0" width="76" height="30" rx="6" fill="#0c1e3a" stroke="#dea584" stroke-width="1.2" />
      <circle cx="200" cy="15" r="3" fill="#dea584" />
      <text x="212" y="19" fill="#ffffff" font-weight="700">Rust</text>

      <!-- TypeScript -->
      <rect x="274" y="0" width="94" height="30" rx="6" fill="#0c1e3a" stroke="#3178c6" stroke-width="1.2" />
      <circle cx="286" cy="15" r="3" fill="#3178c6" />
      <text x="298" y="19" fill="#ffffff" font-weight="700">Node / TS</text>

      <!-- Subtitle Tag -->
      <text x="0" y="52" font-size="9" fill="#7193c4">Concurrency // Low Latency // Goroutines // Memory Safety</text>
    </g>
  </g>

  <!-- MODULE 02: Cloud & DevOps Orchestration (Purple) -->
  <g transform="translate(452, 54)">
    <rect x="0" y="0" width="404" height="122" rx="10" fill="url(#cardGradPurple)" stroke="#b827fc" stroke-width="1.2" class="pulse-purple" />
    
    <text x="18" y="24" class="chip-mono" font-size="11" fill="#b827fc" font-weight="800" letter-spacing="1">
      [02] CLOUD INFRASTRUCTURE &amp; ORCHESTRATION
    </text>
    <line x1="18" y1="34" x2="386" y2="34" stroke="#2e1654" stroke-width="1" />

    <g transform="translate(18, 48)" class="chip-mono" font-size="10.5">
      <!-- Kubernetes -->
      <rect x="0" y="0" width="108" height="30" rx="6" fill="#1b0e36" stroke="#326ce5" stroke-width="1.2" />
      <circle cx="12" cy="15" r="3" fill="#326ce5" filter="url(#chipGlow)" />
      <text x="24" y="19" fill="#ffffff" font-weight="700">Kubernetes</text>

      <!-- Docker -->
      <rect x="118" y="0" width="86" height="30" rx="6" fill="#1b0e36" stroke="#2496ed" stroke-width="1.2" />
      <circle cx="130" cy="15" r="3" fill="#2496ed" />
      <text x="142" y="19" fill="#ffffff" font-weight="700">Docker</text>

      <!-- Terraform -->
      <rect x="214" y="0" width="98" height="30" rx="6" fill="#1b0e36" stroke="#844fba" stroke-width="1.2" />
      <circle cx="226" cy="15" r="3" fill="#844fba" />
      <text x="238" y="19" fill="#ffffff" font-weight="700">Terraform</text>

      <!-- AWS -->
      <rect x="322" y="0" width="56" height="30" rx="6" fill="#1b0e36" stroke="#ff9900" stroke-width="1.2" />
      <circle cx="332" cy="15" r="3" fill="#ff9900" />
      <text x="342" y="19" fill="#ffffff" font-weight="700">AWS</text>

      <text x="0" y="52" font-size="9" fill="#b091db">GitOps // Helm Charts // Multi-AZ Clusters // IaC</text>
    </g>
  </g>

  <!-- MODULE 03: Data Storage & Message Streaming (Emerald Green) -->
  <g transform="translate(24, 190)">
    <rect x="0" y="0" width="404" height="122" rx="10" fill="url(#cardGradGreen)" stroke="#00ffb3" stroke-width="1.2" class="pulse-green" />
    
    <text x="18" y="24" class="chip-mono" font-size="11" fill="#00ffb3" font-weight="800" letter-spacing="1">
      [03] DATA STORAGE &amp; EVENT-STREAMING MESH
    </text>
    <line x1="18" y1="34" x2="386" y2="34" stroke="#0e3a30" stroke-width="1" />

    <g transform="translate(18, 48)" class="chip-mono" font-size="10.5">
      <!-- PostgreSQL -->
      <rect x="0" y="0" width="102" height="30" rx="6" fill="#0b241e" stroke="#4169e1" stroke-width="1.2" />
      <circle cx="12" cy="15" r="3" fill="#4169e1" />
      <text x="24" y="19" fill="#ffffff" font-weight="700">PostgreSQL</text>

      <!-- Redis -->
      <rect x="112" y="0" width="78" height="30" rx="6" fill="#0b241e" stroke="#dc382d" stroke-width="1.2" />
      <circle cx="124" cy="15" r="3" fill="#dc382d" />
      <text x="136" y="19" fill="#ffffff" font-weight="700">Redis</text>

      <!-- Kafka -->
      <rect x="200" y="0" width="88" height="30" rx="6" fill="#0b241e" stroke="#00ffb3" stroke-width="1.2" />
      <circle cx="212" cy="15" r="3" fill="#00ffb3" filter="url(#chipGlow)" />
      <text x="224" y="19" fill="#ffffff" font-weight="700">Kafka</text>

      <!-- gRPC -->
      <rect x="298" y="0" width="76" height="30" rx="6" fill="#0b241e" stroke="#24d0d8" stroke-width="1.2" />
      <circle cx="308" cy="15" r="3" fill="#24d0d8" />
      <text x="320" y="19" fill="#ffffff" font-weight="700">gRPC</text>

      <text x="0" y="52" font-size="9" fill="#69bf9d">Protobuf // Event Sourcing // Partitioning // ACID &amp; Caching</text>
    </g>
  </g>

  <!-- MODULE 04: Observability, Linux & Security (Pink / Magenta) -->
  <g transform="translate(452, 190)">
    <rect x="0" y="0" width="404" height="122" rx="10" fill="url(#cardGradPink)" stroke="#ff007f" stroke-width="1.2" class="pulse-pink" />
    
    <text x="18" y="24" class="chip-mono" font-size="11" fill="#ff007f" font-weight="800" letter-spacing="1">
      [04] OBSERVABILITY, AUTOMATION &amp; LINUX
    </text>
    <line x1="18" y1="34" x2="386" y2="34" stroke="#481438" stroke-width="1" />

    <g transform="translate(18, 48)" class="chip-mono" font-size="10.5">
      <!-- Prometheus -->
      <rect x="0" y="0" width="108" height="30" rx="6" fill="#280c24" stroke="#e6522c" stroke-width="1.2" />
      <circle cx="12" cy="15" r="3" fill="#e6522c" />
      <text x="24" y="19" fill="#ffffff" font-weight="700">Prometheus</text>

      <!-- Grafana -->
      <rect x="118" y="0" width="90" height="30" rx="6" fill="#280c24" stroke="#f46800" stroke-width="1.2" />
      <circle cx="130" cy="15" r="3" fill="#f46800" />
      <text x="142" y="19" fill="#ffffff" font-weight="700">Grafana</text>

      <!-- CI/CD Actions -->
      <rect x="218" y="0" width="98" height="30" rx="6" fill="#280c24" stroke="#2088ff" stroke-width="1.2" />
      <circle cx="230" cy="15" r="3" fill="#2088ff" />
      <text x="242" y="19" fill="#ffffff" font-weight="700">CI/CD</text>

      <!-- Linux -->
      <rect x="326" y="0" width="58" height="30" rx="6" fill="#280c24" stroke="#fcc624" stroke-width="1.2" />
      <circle cx="336" cy="15" r="3" fill="#fcc624" />
      <text x="346" y="19" fill="#ffffff" font-weight="700">Linux</text>

      <text x="0" y="52" font-size="9" fill="#cc7ea8">OpenTelemetry // eBPF Tracing // Automated Pipelines // SLO</text>
    </g>
  </g>
</svg>
