<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="100%" height="310">
  <defs>
    <!-- Matte Dark Glass Background -->
    <linearGradient id="skillsCleanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#090b12" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>

    <!-- Clean Hover/Pulse Animation for Cards -->
    <style>
      @keyframes softCardPulse {
        0%, 100% { stroke-opacity: 0.08; }
        50% { stroke-opacity: 0.22; }
      }

      .card-box {
        animation: softCardPulse 4s ease-in-out infinite;
      }
      .card-b1 { animation-delay: 0s; }
      .card-b2 { animation-delay: 1s; }
      .card-b3 { animation-delay: 2s; }
      .card-b4 { animation-delay: 3s; }

      .skills-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      }
      .skills-mono {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Container -->
  <rect width="880" height="310" rx="14" fill="url(#skillsCleanBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Top Title Bar -->
  <g transform="translate(32, 28)" class="skills-sans">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <text x="12" y="4" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      CORE COMPETENCIES &amp; TECHNICAL ARSENAL
    </text>
    <text x="816" y="4" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">
      Enterprise &amp; Distributed Systems
    </text>
  </g>

  <line x1="32" y1="46" x2="848" y2="46" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- GRID OF 4 MINIMALIST CARDS -->

  <!-- CARD 01: Core Languages & Runtimes -->
  <g transform="translate(32, 60)" class="skills-sans">
    <rect x="0" y="0" width="398" height="110" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#38bdf8" stroke-width="1" class="card-box card-b1" />
    
    <!-- Header -->
    <circle cx="18" cy="20" r="3" fill="#38bdf8" />
    <text x="28" y="24" font-size="11" font-weight="700" fill="#f1f5f9" letter-spacing="0.2">
      Languages &amp; Core Engines
    </text>

    <!-- Tech Badges -->
    <g transform="translate(18, 40)" class="skills-mono" font-size="11">
      <!-- Go -->
      <rect x="0" y="0" width="76" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#00add8" />
      <text x="22" y="18" fill="#f8fafc" font-weight="600">Golang</text>

      <!-- Python -->
      <rect x="84" y="0" width="82" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="96" cy="14" r="3" fill="#38bdf8" />
      <text x="106" y="18" fill="#f8fafc" font-weight="600">Python</text>

      <!-- Rust -->
      <rect x="174" y="0" width="72" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="186" cy="14" r="3" fill="#f97316" />
      <text x="196" y="18" fill="#f8fafc" font-weight="600">Rust</text>

      <!-- TypeScript -->
      <rect x="254" y="0" width="108" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="266" cy="14" r="3" fill="#3178c6" />
      <text x="276" y="18" fill="#f8fafc" font-weight="600">TypeScript</text>

      <!-- Subtitle -->
      <text x="0" y="50" font-size="9" fill="#64748b" class="skills-sans">
        Concurrency · Goroutines · Memory Safety · Asynchronous I/O
      </text>
    </g>
  </g>

  <!-- CARD 02: Cloud & Infrastructure -->
  <g transform="translate(450, 60)" class="skills-sans">
    <rect x="0" y="0" width="398" height="110" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#818cf8" stroke-width="1" class="card-box card-b2" />
    
    <circle cx="18" cy="20" r="3" fill="#818cf8" />
    <text x="28" y="24" font-size="11" font-weight="700" fill="#f1f5f9" letter-spacing="0.2">
      Cloud Infrastructure &amp; DevOps
    </text>

    <g transform="translate(18, 40)" class="skills-mono" font-size="11">
      <!-- Kubernetes -->
      <rect x="0" y="0" width="108" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#326ce5" />
      <text x="22" y="18" fill="#f8fafc" font-weight="600">Kubernetes</text>

      <!-- Docker -->
      <rect x="116" y="0" width="82" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="128" cy="14" r="3" fill="#38bdf8" />
      <text x="138" y="18" fill="#f8fafc" font-weight="600">Docker</text>

      <!-- Terraform -->
      <rect x="206" y="0" width="94" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="218" cy="14" r="3" fill="#844fba" />
      <text x="228" y="18" fill="#f8fafc" font-weight="600">Terraform</text>

      <!-- AWS -->
      <rect x="308" y="0" width="56" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="318" cy="14" r="3" fill="#f59e0b" />
      <text x="328" y="18" fill="#f8fafc" font-weight="600">AWS</text>

      <text x="0" y="50" font-size="9" fill="#64748b" class="skills-sans">
        GitOps · Infrastructure as Code · Multi-AZ Clusters · Helm
      </text>
    </g>
  </g>

  <!-- CARD 03: Data Storage & Messaging -->
  <g transform="translate(32, 182)" class="skills-sans">
    <rect x="0" y="0" width="398" height="110" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#34d399" stroke-width="1" class="card-box card-b3" />
    
    <circle cx="18" cy="20" r="3" fill="#34d399" />
    <text x="28" y="24" font-size="11" font-weight="700" fill="#f1f5f9" letter-spacing="0.2">
      Data Tier &amp; Event Streams
    </text>

    <g transform="translate(18, 40)" class="skills-mono" font-size="11">
      <!-- PostgreSQL -->
      <rect x="0" y="0" width="102" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#336791" />
      <text x="22" y="18" fill="#f8fafc" font-weight="600">PostgreSQL</text>

      <!-- Redis -->
      <rect x="110" y="0" width="76" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="122" cy="14" r="3" fill="#ef4444" />
      <text x="132" y="18" fill="#f8fafc" font-weight="600">Redis</text>

      <!-- Kafka -->
      <rect x="194" y="0" width="86" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="206" cy="14" r="3" fill="#34d399" />
      <text x="216" y="18" fill="#f8fafc" font-weight="600">Kafka</text>

      <!-- gRPC -->
      <rect x="288" y="0" width="76" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="298" cy="14" r="3" fill="#06b6d4" />
      <text x="308" y="18" fill="#f8fafc" font-weight="600">gRPC</text>

      <text x="0" y="50" font-size="9" fill="#64748b" class="skills-sans">
        Event Sourcing · Stream Processing · Partitioning · ACID Transactions
      </text>
    </g>
  </g>

  <!-- CARD 04: Observability & Tooling -->
  <g transform="translate(450, 182)" class="skills-sans">
    <rect x="0" y="0" width="398" height="110" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#fbbf24" stroke-width="1" class="card-box card-b4" />
    
    <circle cx="18" cy="20" r="3" fill="#fbbf24" />
    <text x="28" y="24" font-size="11" font-weight="700" fill="#f1f5f9" letter-spacing="0.2">
      Observability &amp; Reliability
    </text>

    <g transform="translate(18, 40)" class="skills-mono" font-size="11">
      <!-- Prometheus -->
      <rect x="0" y="0" width="108" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="12" cy="14" r="3" fill="#e6522c" />
      <text x="22" y="18" fill="#f8fafc" font-weight="600">Prometheus</text>

      <!-- Grafana -->
      <rect x="116" y="0" width="86" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="128" cy="14" r="3" fill="#f46800" />
      <text x="138" y="18" fill="#f8fafc" font-weight="600">Grafana</text>

      <!-- CI/CD -->
      <rect x="210" y="0" width="86" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="222" cy="14" r="3" fill="#3b82f6" />
      <text x="232" y="18" fill="#f8fafc" font-weight="600">CI/CD</text>

      <!-- Linux -->
      <rect x="304" y="0" width="68" height="28" rx="5" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <circle cx="314" cy="14" r="3" fill="#facc15" />
      <text x="324" y="18" fill="#f8fafc" font-weight="600">Linux</text>

      <text x="0" y="50" font-size="9" fill="#64748b" class="skills-sans">
        OpenTelemetry · Distributed Tracing · Automated Workflows · SLOs
      </text>
    </g>
  </g>
</svg>
