<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="290">
  <defs>
    <!-- Matte Dark Glass Background -->
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="60%" stop-color="#090b12" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>

    <!-- Spline Area Fill Gradient -->
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="curveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="softNodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      @keyframes packetTravel {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveMorph {
        0%, 100% { d: path("M 0 35 Q 35 10, 70 28 T 140 18 T 210 36 T 280 14 T 350 26 T 420 16 T 490 24 L 490 80 L 0 80 Z"); }
        50% { d: path("M 0 25 Q 35 36, 70 16 T 140 32 T 210 18 T 280 34 T 350 16 T 420 28 T 490 18 L 490 80 L 0 80 Z"); }
      }
      @keyframes waveStrokeMorph {
        0%, 100% { d: path("M 0 35 Q 35 10, 70 28 T 140 18 T 210 36 T 280 14 T 350 26 T 420 16 T 490 24"); }
        50% { d: path("M 0 25 Q 35 36, 70 16 T 140 32 T 210 18 T 280 34 T 350 16 T 420 28 T 490 18"); }
      }

      .node-core {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: center;
      }
      .packet-link {
        stroke-dasharray: 12 30;
        animation: packetTravel 2.5s linear infinite;
      }
      .wave-area {
        animation: waveMorph 4s ease-in-out infinite;
      }
      .wave-line {
        animation: waveStrokeMorph 4s ease-in-out infinite;
      }

      .dash-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      }
      .dash-mono {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
      }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect width="880" height="290" rx="14" fill="url(#dashBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Top Title Bar -->
  <g transform="translate(32, 28)" class="dash-sans">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <text x="12" y="4" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      CLOUD ARCHITECTURE &amp; SERVICE TOPOLOGY
    </text>
    <text x="816" y="4" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">
      Multi-AZ Kubernetes Mesh · High Availability
    </text>
  </g>

  <line x1="32" y1="46" x2="848" y2="46" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- LEFT SECTION: Modern Minimalist Microservices Topology -->
  <g transform="translate(32, 60)">
    <rect x="0" y="0" width="270" height="205" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    
    <text x="16" y="24" class="dash-mono" font-size="9" fill="#64748b" font-weight="600" letter-spacing="1">
      SERVICE MESH GRAPH
    </text>

    <!-- Node Network Lines -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2">
      <!-- To K8s Ingress -->
      <path d="M 135 115 C 135 75, 195 70, 205 70" />
      <path d="M 135 115 C 135 75, 195 70, 205 70" stroke="#38bdf8" stroke-width="1.6" class="packet-link" />

      <!-- To Kafka Stream -->
      <path d="M 135 115 C 135 155, 195 160, 205 160" />
      <path d="M 135 115 C 135 155, 195 160, 205 160" stroke="#818cf8" stroke-width="1.6" class="packet-link" />

      <!-- To Postgres HA -->
      <path d="M 135 115 C 135 155, 75 160, 65 160" />
      <path d="M 135 115 C 135 155, 75 160, 65 160" stroke="#34d399" stroke-width="1.6" class="packet-link" />

      <!-- To Redis Cache -->
      <path d="M 135 115 C 135 75, 75 70, 65 70" />
      <path d="M 135 115 C 135 75, 75 70, 65 70" stroke="#fbbf24" stroke-width="1.6" class="packet-link" />
    </g>

    <!-- Central Node: API Gateway -->
    <circle cx="135" cy="115" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="135" cy="115" r="5" fill="#38bdf8" class="node-core" filter="url(#softNodeGlow)" />
    <text x="135" y="138" class="dash-mono" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="600">GATEWAY</text>

    <!-- Peripheral Service Nodes -->
    <!-- Node 1: K8s Ingress -->
    <circle cx="205" cy="70" r="8" fill="#111827" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="205" cy="70" r="3.5" fill="#38bdf8" />
    <text x="218" y="73" class="dash-mono" font-size="8" fill="#cbd5e1" font-weight="600">K8S</text>

    <!-- Node 2: Kafka -->
    <circle cx="205" cy="160" r="8" fill="#111827" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="205" cy="160" r="3.5" fill="#818cf8" />
    <text x="218" y="163" class="dash-mono" font-size="8" fill="#cbd5e1" font-weight="600">KAFKA</text>

    <!-- Node 3: PostgreSQL -->
    <circle cx="65" cy="160" r="8" fill="#111827" stroke="#34d399" stroke-width="1.2" />
    <circle cx="65" cy="160" r="3.5" fill="#34d399" />
    <text x="52" y="163" class="dash-mono" font-size="8" fill="#cbd5e1" text-anchor="end" font-weight="600">POSTGRES</text>

    <!-- Node 4: Redis -->
    <circle cx="65" cy="70" r="8" fill="#111827" stroke="#fbbf24" stroke-width="1.2" />
    <circle cx="65" cy="70" r="3.5" fill="#fbbf24" />
    <text x="52" y="73" class="dash-mono" font-size="8" fill="#cbd5e1" text-anchor="end" font-weight="600">REDIS</text>
  </g>

  <!-- RIGHT SECTION: Modern Telemetry Metrics & Clean Area Chart -->
  <g transform="translate(325, 60)" class="dash-sans">
    <!-- Row 1: 3 Sleek Metric Cards -->
    <!-- Metric 1: Uptime -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="74" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
      <text x="14" y="22" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">SERVICE AVAILABILITY</text>
      <text x="14" y="48" font-size="22" font-weight="800" fill="#f8fafc">99.99%</text>
      <text x="14" y="64" font-size="9" font-weight="500" fill="#10b981">Multi-AZ SLA Active</text>
    </g>

    <!-- Metric 2: P99 Latency -->
    <g transform="translate(178, 0)">
      <rect x="0" y="0" width="165" height="74" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
      <text x="14" y="22" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">P99 LATENCY</text>
      <text x="14" y="48" font-size="22" font-weight="800" fill="#38bdf8">&lt; 0.8ms</text>
      <text x="14" y="64" font-size="9" font-weight="500" fill="#60a5fa">Sub-millisecond API</text>
    </g>

    <!-- Metric 3: Throughput Capacity -->
    <g transform="translate(356, 0)">
      <rect x="0" y="0" width="167" height="74" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
      <text x="14" y="22" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">INGESTION PEAK</text>
      <text x="14" y="48" font-size="22" font-weight="800" fill="#c084fc">120k+<tspan font-size="12" font-weight="500" fill="#64748b">/sec</tspan></text>
      <text x="14" y="64" font-size="9" font-weight="500" fill="#a855f7">Kafka Partitioned</text>
    </g>

    <!-- Row 2: Clean Minimalist Spline Wave Chart -->
    <g transform="translate(0, 86)">
      <rect x="0" y="0" width="523" height="119" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
      
      <text x="16" y="22" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">EVENT-STREAM THROUGHPUT TELEMETRY</text>
      <text x="507" y="22" font-size="9.5" font-weight="600" fill="#10b981" text-anchor="end">REAL-TIME</text>

      <!-- Spline Chart Curve -->
      <g transform="translate(16, 28)">
        <path class="wave-area" fill="url(#areaFill)" />
        <path class="wave-line" fill="none" stroke="url(#curveStroke)" stroke-width="2" />
      </g>
    </g>
  </g>
</svg>
