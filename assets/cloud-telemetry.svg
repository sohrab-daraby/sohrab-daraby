<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="320">
  <defs>
    <linearGradient id="teleGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16" />
      <stop offset="60%" stop-color="#081022" />
      <stop offset="100%" stop-color="#03060f" />
    </linearGradient>

    <linearGradient id="radarConic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#b827fc" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>

    <radialGradient id="radarAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="teleBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarSweepSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rippleRingScale {
        0% { r: 6px; opacity: 1; stroke-width: 2px; }
        100% { r: 42px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes streamMotion {
        0% { stroke-dashoffset: 140; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes oscilWave {
        0%, 100% { d: path("M 0 30 Q 30 5, 60 25 T 120 15 T 180 40 T 240 10 T 300 28 T 360 20 T 420 32 T 480 18 T 520 25"); }
        50% { d: path("M 0 20 Q 30 40, 60 12 T 120 35 T 180 15 T 240 38 T 300 12 T 360 30 T 420 15 T 480 35 T 520 20"); }
      }
      @keyframes ringProgress1 {
        0% { stroke-dashoffset: 220; }
        100% { stroke-dashoffset: 35; }
      }

      .radar-arm {
        animation: radarSweepSpin 4.5s linear infinite;
        transform-origin: 155px 165px;
      }
      .ring-p1 { animation: rippleRingScale 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .ring-p2 { animation: rippleRingScale 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite 0.8s; }
      .ring-p3 { animation: rippleRingScale 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.6s; }

      .packet-flow {
        stroke-dasharray: 18 45;
        animation: streamMotion 2s linear infinite;
      }
      .osc-path {
        animation: oscilWave 3s ease-in-out infinite;
      }

      .tele-code {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      }
    </style>
  </defs>

  <!-- Base Glass Enclosure -->
  <rect width="880" height="320" rx="14" fill="url(#teleGlassBg)" stroke="#172b50" stroke-width="1.6" />

  <!-- Top Glass Bar -->
  <g class="tele-code" font-size="11">
    <path d="M 0 14 C 0 6.26 6.26 0 14 0 L 866 0 C 873.74 0 880 6.26 880 14 L 880 38 L 0 38 Z" fill="#0b152b" stroke="#172b50" stroke-width="1" />
    
    <circle cx="28" cy="19" r="4.5" fill="#00f2fe" filter="url(#teleBloom)" />
    <text x="44" y="23" fill="#00f2fe" font-weight="700" letter-spacing="1">DISTRIBUTED SYSTEM TELEMETRY // REAL-TIME MESH RADAR</text>

    <text x="850" y="23" fill="#00ffb3" text-anchor="end" font-weight="600">
      ● 6 NODES HEALTHY // ZERO-LAG
    </text>
  </g>

  <!-- LEFT PANE: 3D Holographic Microservices Radar -->
  <g transform="translate(15, 0)">
    <!-- Radar Aura -->
    <circle cx="155" cy="165" r="115" fill="url(#radarAura)" />

    <!-- Range Rings -->
    <circle cx="155" cy="165" r="32" fill="none" stroke="#1a3666" stroke-width="1" />
    <circle cx="155" cy="165" r="70" fill="none" stroke="#1a3666" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="155" cy="165" r="110" fill="none" stroke="#234685" stroke-width="1.3" />

    <!-- Grid Crosshair Guides -->
    <line x1="45" y1="165" x2="265" y2="165" stroke="#1a3666" stroke-width="1" />
    <line x1="155" y1="55" x2="155" y2="275" stroke="#1a3666" stroke-width="1" />
    <line x1="75" y1="85" x2="235" y2="245" stroke="#132747" stroke-width="1" stroke-dasharray="3 4" />
    <line x1="75" y1="245" x2="235" y2="85" stroke="#132747" stroke-width="1" stroke-dasharray="3 4" />

    <!-- 360-Degree Rotating Radar Sweep Sector -->
    <g class="radar-arm">
      <path d="M 155 165 L 155 55 A 110 110 0 0 1 250 110 Z" fill="url(#radarConic)" />
      <line x1="155" y1="165" x2="250" y2="110" stroke="#00f2fe" stroke-width="2" filter="url(#teleBloom)" />
    </g>

    <!-- Pulsing Ripple Rings -->
    <circle cx="155" cy="165" r="8" fill="none" stroke="#00f2fe" class="ring-p1" />
    <circle cx="155" cy="165" r="8" fill="none" stroke="#00f2fe" class="ring-p2" />
    <circle cx="155" cy="165" r="8" fill="none" stroke="#00f2fe" class="ring-p3" />

    <!-- Orbiting Mesh Nodes & Laser Pipelines -->
    <!-- Center Node: API Gateway -->
    <circle cx="155" cy="165" r="7" fill="#00f2fe" filter="url(#teleBloom)" />
    <text x="155" y="184" class="tele-code" font-size="8.5" fill="#ffffff" font-weight="700" text-anchor="middle">API-GW</text>

    <!-- Node 1: K8s Pods (Top Right) -->
    <line x1="155" y1="165" x2="225" y2="105" stroke="#1a3a6b" stroke-width="1.5" />
    <line x1="155" y1="165" x2="225" y2="105" stroke="#00ffb3" stroke-width="2" class="packet-flow" />
    <circle cx="225" cy="105" r="5" fill="#00ffb3" filter="url(#teleBloom)" />
    <text x="234" y="103" class="tele-code" font-size="8" fill="#00ffb3" font-weight="700">K8S PODS</text>

    <!-- Node 2: Kafka Event Stream (Bottom Right) -->
    <line x1="155" y1="165" x2="228" y2="218" stroke="#1a3a6b" stroke-width="1.5" />
    <line x1="155" y1="165" x2="228" y2="218" stroke="#b827fc" stroke-width="2" class="packet-flow" />
    <circle cx="228" cy="218" r="5" fill="#b827fc" filter="url(#teleBloom)" />
    <text x="236" y="222" class="tele-code" font-size="8" fill="#b827fc" font-weight="700">KAFKA STREAM</text>

    <!-- Node 3: Postgres HA (Bottom Left) -->
    <line x1="155" y1="165" x2="82" y2="218" stroke="#1a3a6b" stroke-width="1.5" />
    <line x1="155" y1="165" x2="82" y2="218" stroke="#4facfe" stroke-width="2" class="packet-flow" />
    <circle cx="82" cy="218" r="5" fill="#4facfe" filter="url(#teleBloom)" />
    <text x="36" y="232" class="tele-code" font-size="8" fill="#4facfe" font-weight="700">POSTGRES HA</text>

    <!-- Node 4: Redis Cluster (Top Left) -->
    <line x1="155" y1="165" x2="85" y2="105" stroke="#1a3a6b" stroke-width="1.5" />
    <line x1="155" y1="165" x2="85" y2="105" stroke="#ff007f" stroke-width="2" class="packet-flow" />
    <circle cx="85" cy="105" r="5" fill="#ff007f" filter="url(#teleBloom)" />
    <text x="44" y="98" class="tele-code" font-size="8" fill="#ff007f" font-weight="700">REDIS MESH</text>
  </g>

  <!-- RIGHT PANE: Telemetry HUD Gauges & Real-Time Stream Wave -->
  <g transform="translate(315, 52)" class="tele-code">
    <!-- Row 1: 3 Circular Futuristic Progress Rings -->
    <!-- Gauge 1: Uptime Availability -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="88" rx="8" fill="#070f22" stroke="#172e56" stroke-width="1.2" />
      <!-- Circular Progress -->
      <circle cx="44" cy="44" r="28" fill="none" stroke="#101e38" stroke-width="5" />
      <circle cx="44" cy="44" r="28" fill="none" stroke="#00ffb3" stroke-width="5" stroke-dasharray="176" stroke-dashoffset="6" stroke-linecap="round" filter="url(#teleBloom)" transform="rotate(-90 44 44)" />
      <text x="44" y="47" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">99.9%</text>
      <!-- Labels -->
      <text x="86" y="36" font-size="9" fill="#7192be" font-weight="600">UPTIME</text>
      <text x="86" y="54" font-size="13" fill="#00ffb3" font-weight="800">OPTIMAL</text>
      <text x="86" y="68" font-size="7.5" fill="#718bb0">Multi-AZ SLA</text>
    </g>

    <!-- Gauge 2: P99 Latency -->
    <g transform="translate(182, 0)">
      <rect x="0" y="0" width="168" height="88" rx="8" fill="#070f22" stroke="#172e56" stroke-width="1.2" />
      <circle cx="44" cy="44" r="28" fill="none" stroke="#101e38" stroke-width="5" />
      <circle cx="44" cy="44" r="28" fill="none" stroke="#00f2fe" stroke-width="5" stroke-dasharray="176" stroke-dashoffset="18" stroke-linecap="round" filter="url(#teleBloom)" transform="rotate(-90 44 44)" />
      <text x="44" y="47" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">0.4ms</text>
      <text x="86" y="36" font-size="9" fill="#7192be" font-weight="600">P99 LATENCY</text>
      <text x="86" y="54" font-size="13" fill="#00f2fe" font-weight="800">&lt; 1.0 ms</text>
      <text x="86" y="68" font-size="7.5" fill="#00ffb3">eBPF Optimized</text>
    </g>

    <!-- Gauge 3: Throughput Capacity -->
    <g transform="translate(364, 0)">
      <rect x="0" y="0" width="176" height="88" rx="8" fill="#070f22" stroke="#172e56" stroke-width="1.2" />
      <circle cx="44" cy="44" r="28" fill="none" stroke="#101e38" stroke-width="5" />
      <circle cx="44" cy="44" r="28" fill="none" stroke="#ff007f" stroke-width="5" stroke-dasharray="176" stroke-dashoffset="24" stroke-linecap="round" filter="url(#teleBloom)" transform="rotate(-90 44 44)" />
      <text x="44" y="47" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">240k</text>
      <text x="86" y="36" font-size="9" fill="#7192be" font-weight="600">THROUGHPUT</text>
      <text x="86" y="54" font-size="13" fill="#ff007f" font-weight="800">240k RPS</text>
      <text x="86" y="68" font-size="7.5" fill="#b827fc">Kafka Partitioned</text>
    </g>

    <!-- Row 2: Real-Time Oscilloscope Waveform & Event Stream Feed -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="540" height="148" rx="8" fill="#070f22" stroke="#172e56" stroke-width="1.2" />
      
      <!-- Top Waveform Header -->
      <text x="16" y="22" font-size="9.5" fill="#00f2fe" font-weight="700" letter-spacing="1">EVENT-STREAM INGESTION // KAFKA PARTITION 0..15</text>
      <text x="524" y="22" font-size="9" fill="#00ffb3" text-anchor="end">BUFFER: HEALTHY</text>

      <!-- Waveform Canvas Grid -->
      <g stroke="#101c36" stroke-width="1" stroke-dasharray="3 3">
        <line x1="16" y1="46" x2="524" y2="46" />
        <line x1="16" y1="74" x2="524" y2="74" />
        <line x1="16" y1="102" x2="524" y2="102" />
      </g>

      <!-- Live Oscilloscope Sine Wave Path -->
      <g transform="translate(10, 48)">
        <path class="osc-path" fill="none" stroke="url(#waveLineGrad)" stroke-width="2.5" filter="url(#teleBloom)" />
      </g>

      <!-- Live Event Log Ticker -->
      <g transform="translate(16, 134)" font-size="8.5">
        <circle cx="4" cy="-3" r="3" fill="#00ffb3" />
        <text x="14" y="0" fill="#a4c2ea">[12:48:30] <tspan fill="#00ffb3">AUTOSCALE:</tspan> K8s Ingress replica set 100% synchronized</text>
        <text x="508" y="0" fill="#718bb0" text-anchor="end">0.000% ERR</text>
      </g>
    </g>
  </g>
</svg>
