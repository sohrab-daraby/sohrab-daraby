<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="290">
  <defs>
    <linearGradient id="teleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="60%" stop-color="#091224" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="dataLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#b827fc" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>

    <radialGradient id="radarCenterAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes rippleRing {
        0% { r: 6px; opacity: 0.9; stroke-width: 2px; }
        100% { r: 36px; opacity: 0; stroke-width: 0.5px; }
      }

      @keyframes nodeGlowPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00f2fe); }
        50% { transform: scale(1.18); filter: drop-shadow(0 0 10px #f246fe); }
      }

      @keyframes streamDataPacket {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes throughputWave {
        0%, 100% { d: path("M 0 35 Q 25 15, 50 30 T 100 20 T 150 40 T 200 15 T 250 30 T 280 25"); }
        50% { d: path("M 0 25 Q 25 38, 50 15 T 100 35 T 150 20 T 200 40 T 250 15 T 280 32"); }
      }

      .radar-sweep {
        animation: rotateRadar 5s linear infinite;
        transform-origin: 150px 145px;
      }

      .ping-1 { animation: rippleRing 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .ping-2 { animation: rippleRing 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite 0.8s; }
      .ping-3 { animation: rippleRing 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.6s; }

      .node-pulse {
        animation: nodeGlowPulse 2.8s ease-in-out infinite;
        transform-origin: center;
      }

      .pipeline-stream {
        stroke-dasharray: 20 50;
        animation: streamDataPacket 2s linear infinite;
      }

      .wave-path {
        animation: throughputWave 3.5s ease-in-out infinite;
      }

      .tele-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace;
      }
    </style>
  </defs>

  <!-- Card Background Housing -->
  <rect width="880" height="290" rx="14" fill="url(#teleBg)" stroke="#1a2d54" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g class="tele-font" font-size="11">
    <rect x="0" y="0" width="880" height="36" rx="14" fill="#0c162c" fill-opacity="0.8" />
    <path d="M 0 36 L 880 36" stroke="#1c305a" stroke-width="1" />
    
    <circle cx="28" cy="18" r="4" fill="#00ff9d" filter="url(#radarGlow)" />
    <text x="42" y="22" fill="#00ff9d" font-weight="700" letter-spacing="1">LIVE CLOUD TELEMETRY // DISTRIBUTED ARCHITECTURE RADAR</text>
    
    <text x="850" y="22" fill="#6687b8" text-anchor="end">REGION: GLOBAL MULTI-AZ</text>
  </g>

  <!-- Left: Animated Microservices Radar System -->
  <g transform="translate(10, 0)">
    <!-- Radar Ambient Background -->
    <circle cx="150" cy="155" r="105" fill="url(#radarCenterAura)" />

    <!-- Concentric Radar Range Rings -->
    <circle cx="150" cy="155" r="30" fill="none" stroke="#1d3866" stroke-width="1" />
    <circle cx="150" cy="155" r="65" fill="none" stroke="#1d3866" stroke-width="1" stroke-dasharray="4 3" />
    <circle cx="150" cy="155" r="100" fill="none" stroke="#254780" stroke-width="1.2" />

    <!-- Crosshair Coordinates -->
    <line x1="45" y1="155" x2="255" y2="155" stroke="#1d3866" stroke-width="1" />
    <line x1="150" y1="50" x2="150" y2="260" stroke="#1d3866" stroke-width="1" />

    <!-- Diagonal Guide Markers -->
    <line x1="75" y1="80" x2="225" y2="230" stroke="#142645" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="75" y1="230" x2="225" y2="80" stroke="#142645" stroke-width="1" stroke-dasharray="2 4" />

    <!-- 360-Degree Rotating Radar Sweep Sector -->
    <g class="radar-sweep">
      <path d="M 150 155 L 150 55 A 100 100 0 0 1 236 105 Z" fill="url(#radarSweepGrad)" />
      <line x1="150" y1="155" x2="236" y2="105" stroke="#00f2fe" stroke-width="1.8" filter="url(#radarGlow)" />
    </g>

    <!-- Pulsing Radar Ping Rings -->
    <circle cx="150" cy="155" r="8" fill="none" stroke="#00f2fe" class="ping-1" />
    <circle cx="150" cy="155" r="8" fill="none" stroke="#00f2fe" class="ping-2" />
    <circle cx="150" cy="155" r="8" fill="none" stroke="#00f2fe" class="ping-3" />

    <!-- Distributed Service Nodes in Orbit -->
    <!-- Node 1: API Gateway (Center) -->
    <circle cx="150" cy="155" r="6" fill="#00f2fe" class="node-pulse" />
    <text x="150" y="172" class="tele-font" font-size="8" fill="#c4ebff" font-weight="700" text-anchor="middle">API-GW</text>

    <!-- Node 2: K8s Ingress (Top Right) -->
    <line x1="150" y1="155" x2="210" y2="105" stroke="#193963" stroke-width="1.2" />
    <line x1="150" y1="155" x2="210" y2="105" stroke="#00ff9d" stroke-width="1.6" class="pipeline-stream" />
    <circle cx="210" cy="105" r="4.5" fill="#00ff9d" filter="url(#radarGlow)" />
    <text x="218" y="102" class="tele-font" font-size="7.5" fill="#00ff9d" font-weight="600">K8S PODS</text>

    <!-- Node 3: Kafka Stream (Bottom Right) -->
    <line x1="150" y1="155" x2="215" y2="200" stroke="#193963" stroke-width="1.2" />
    <line x1="150" y1="155" x2="215" y2="200" stroke="#f246fe" stroke-width="1.6" class="pipeline-stream" />
    <circle cx="215" cy="200" r="4.5" fill="#f246fe" filter="url(#radarGlow)" />
    <text x="224" y="204" class="tele-font" font-size="7.5" fill="#f246fe" font-weight="600">KAFKA MESH</text>

    <!-- Node 4: PostgreSQL HA (Bottom Left) -->
    <line x1="150" y1="155" x2="85" y2="205" stroke="#193963" stroke-width="1.2" />
    <line x1="150" y1="155" x2="85" y2="205" stroke="#00f2fe" stroke-width="1.6" class="pipeline-stream" />
    <circle cx="85" cy="205" r="4.5" fill="#00f2fe" filter="url(#radarGlow)" />
    <text x="44" y="218" class="tele-font" font-size="7.5" fill="#00f2fe" font-weight="600">POSTGRES HA</text>

    <!-- Node 5: Redis Cache (Top Left) -->
    <line x1="150" y1="155" x2="90" y2="100" stroke="#193963" stroke-width="1.2" />
    <line x1="150" y1="155" x2="90" y2="100" stroke="#ffbd2e" stroke-width="1.6" class="pipeline-stream" />
    <circle cx="90" cy="100" r="4.5" fill="#ffbd2e" filter="url(#radarGlow)" />
    <text x="50" y="94" class="tele-font" font-size="7.5" fill="#ffbd2e" font-weight="600">REDIS CLUSTER</text>
  </g>

  <!-- Right: Telemetry Metrics & Throughput Dashboard -->
  <g transform="translate(305, 52)" class="tele-font">
    <!-- Stat Box 1: RPS / Throughput -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="74" rx="8" fill="#081020" stroke="#172b4f" stroke-width="1.2" />
      <text x="14" y="22" font-size="9" fill="#7294c4" font-weight="600">RPS THROUGHPUT</text>
      <text x="14" y="48" font-size="20" fill="#00f2fe" font-weight="800">184.2k<tspan font-size="11" fill="#7196cb">/s</tspan></text>
      <text x="14" y="64" font-size="8.5" fill="#00ff9d">▲ 14.8% peak handling</text>
    </g>

    <!-- Stat Box 2: Latency P99 -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="170" height="74" rx="8" fill="#081020" stroke="#172b4f" stroke-width="1.2" />
      <text x="14" y="22" font-size="9" fill="#7294c4" font-weight="600">P99 LATENCY</text>
      <text x="14" y="48" font-size="20" fill="#00ff9d" font-weight="800">1.18<tspan font-size="11" fill="#7196cb">ms</tspan></text>
      <text x="14" y="64" font-size="8.5" fill="#00f2fe">● Ultra low latency</text>
    </g>

    <!-- Stat Box 3: Error Rate & Uptime -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="180" height="74" rx="8" fill="#081020" stroke="#172b4f" stroke-width="1.2" />
      <text x="14" y="22" font-size="9" fill="#7294c4" font-weight="600">SERVICE AVAILABILITY</text>
      <text x="14" y="48" font-size="20" fill="#b827fc" font-weight="800">99.998%</text>
      <text x="14" y="64" font-size="8.5" fill="#00ff9d">ERR RATE: 0.0002%</text>
    </g>

    <!-- Lower Panel: Animated Real-Time Throughput Waveform -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="550" height="126" rx="8" fill="#081022" stroke="#1a2e54" stroke-width="1.2" />
      
      <text x="16" y="22" font-size="9" fill="#00f2fe" font-weight="700" letter-spacing="1">EVENT-STREAM THROUGHPUT // REAL-TIME KAFKA INGESTION</text>
      <text x="534" y="22" font-size="9" fill="#00ff9d" text-anchor="end">STREAM: ACTIVE</text>

      <!-- Waveform Grid Lines -->
      <line x1="16" y1="50" x2="534" y2="50" stroke="#12203b" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="16" y1="80" x2="534" y2="80" stroke="#12203b" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="16" y1="110" x2="534" y2="110" stroke="#12203b" stroke-width="1" stroke-dasharray="3 3" />

      <!-- Animated SVG Wave Curve -->
      <g transform="translate(20, 48)">
        <path class="wave-path" fill="none" stroke="url(#dataLineGrad)" stroke-width="2.5" filter="url(#radarGlow)" />
      </g>

      <!-- Legend Tags -->
      <g transform="translate(16, 114)" font-size="8.5">
        <circle cx="4" cy="-4" r="3" fill="#00f2fe" />
        <text x="12" y="0" fill="#7f9fcd">Go Microservices</text>

        <circle cx="130" cy="-4" r="3" fill="#b827fc" />
        <text x="138" y="0" fill="#7f9fcd">Kafka Bus</text>

        <circle cx="230" cy="-4" r="3" fill="#00ff9d" />
        <text x="238" y="0" fill="#7f9fcd">K8s Autoscaling</text>
      </g>
    </g>
  </g>
</svg>
