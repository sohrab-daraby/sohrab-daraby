<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360">
  <defs>
    <!-- Modern Luxury Dark Obsidian Background -->
    <radialGradient id="novaAmbient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#090d1a" />
      <stop offset="85%" stop-color="#04060d" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>

    <!-- Refined Executive Nova Gradients -->
    <linearGradient id="novaSilverTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="iceBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="subtleBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="starBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softLaser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Precision Dot Matrix Pattern -->
    <pattern id="precisionGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#38bdf8" fill-opacity="0.15" />
      <line x1="0" y1="28" x2="28" y2="28" stroke="#1e293b" stroke-opacity="0.1" stroke-width="0.5" />
    </pattern>

    <style>
      @keyframes orbitSpin1 {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitSpin2 {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes novaStarPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 24px rgba(129, 140, 248, 0.9)); }
      }
      @keyframes borderStream {
        0% { stroke-dashoffset: 2500; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes sweepScan {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.5; }
        85% { opacity: 0.5; }
        100% { transform: translateY(360px); opacity: 0; }
      }
      @keyframes eqBarSmooth {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(1); }
      }

      .star-pulsing { animation: novaStarPulse 4s ease-in-out infinite; transform-origin: 730px 180px; }
      .ring-1 { animation: orbitSpin1 16s linear infinite; transform-origin: 730px 180px; }
      .ring-2 { animation: orbitSpin2 22s linear infinite; transform-origin: 730px 180px; }
      .border-flow { stroke-dasharray: 450 800; animation: borderStream 9s linear infinite; }
      .laser-line { animation: sweepScan 7s linear infinite; }

      .eq-bar { transform-origin: bottom; animation: eqBarSmooth 0.8s ease-in-out infinite alternate; }
      .eq-b1 { animation-duration: 0.7s; animation-delay: 0.1s; }
      .eq-b2 { animation-duration: 0.9s; animation-delay: 0.3s; }
      .eq-b3 { animation-duration: 0.6s; animation-delay: 0.05s; }
      .eq-b4 { animation-duration: 0.85s; animation-delay: 0.25s; }
      .eq-b5 { animation-duration: 0.65s; animation-delay: 0.4s; }

      .pro-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      }
      .pro-mono {
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Canvas Frame -->
  <rect width="900" height="360" rx="16" fill="url(#novaAmbient)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Precision Matrix Grid -->
  <rect width="900" height="360" rx="16" fill="url(#precisionGrid)" />

  <!-- Flowing Border Stream -->
  <rect x="2" y="2" width="896" height="356" rx="15" fill="none" stroke="url(#subtleBorderGrad)" stroke-width="1.8" class="border-flow" filter="url(#softLaser)" />

  <!-- Top Executive Status HUD -->
  <g transform="translate(32, 22)" class="pro-mono" font-size="10.5">
    <rect x="0" y="0" width="836" height="34" rx="8" fill="#090d1b" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    
    <!-- Active Status Beacon -->
    <circle cx="22" cy="17" r="4.5" fill="#10b981" filter="url(#softLaser)" />
    <circle cx="22" cy="17" r="8" fill="none" stroke="#10b981" stroke-opacity="0.35" />
    <text x="38" y="21" fill="#10b981" font-weight="700" letter-spacing="1">NOVA CLUSTER // OPERATIONAL</text>

    <!-- Telemetry Info -->
    <text x="320" y="21" fill="#64748b">ARCHITECTURE: <tspan fill="#38bdf8" font-weight="600">DISTRIBUTED CLUSTER</tspan></text>
    <text x="545" y="21" fill="#64748b">UPTIME: <tspan fill="#ffffff" font-weight="700">99.999%</tspan></text>

    <!-- Team Badge -->
    <rect x="735" y="6" width="90" height="22" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="748" y="21" fill="#38bdf8" font-weight="700">TEAM NOVA</text>
  </g>

  <!-- Left Content: NOVA Brand Typography & Team Lead Identity -->
  <g transform="translate(54, 96)">
    <!-- Category Super-Title -->
    <g class="pro-mono" font-size="11.5" letter-spacing="2">
      <text x="0" y="16" fill="#38bdf8" font-weight="700">// ENGINEERING &amp; CLOUD ARCHITECTURE TEAM</text>
    </g>

    <!-- Main Title: NOVA (Massive, Bold, Refined Modern Sans) -->
    <g transform="translate(0, 76)">
      <text x="0" y="0" class="pro-sans" font-size="58" font-weight="900" letter-spacing="4" fill="url(#novaSilverTitle)" filter="url(#starBloom)">
        NOVA
      </text>
    </g>

    <!-- Tagline & Core Focus -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" class="pro-sans" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1.5">
        HIGH-PERFORMANCE BACKEND &amp; DEVOPS SYSTEMS
      </text>
      <text x="0" y="24" class="pro-mono" font-size="12" fill="#94a3b8" letter-spacing="0.5">
        Lead Architect: <tspan fill="#ffffff" font-weight="700">Sohrab Darabi</tspan> · Resilient Microservices · Cloud Infrastructure
      </text>
    </g>

    <!-- Executive Modern Pill Badges -->
    <g transform="translate(0, 166)" class="pro-mono" font-size="11">
      <!-- Badge 1: Golang / Distributed -->
      <rect x="0" y="0" width="138" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#38bdf8" />
      <text x="28" y="18" fill="#e2e8f0" font-weight="600">GO // PYTHON</text>

      <!-- Badge 2: K8s / Cloud -->
      <rect x="150" y="0" width="158" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="164" cy="14" r="3.5" fill="#818cf8" />
      <text x="178" y="18" fill="#e2e8f0" font-weight="600">KUBERNETES // AWS</text>

      <!-- Badge 3: Kafka / Mesh -->
      <rect x="320" y="0" width="158" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <circle cx="334" cy="14" r="3.5" fill="#10b981" />
      <text x="348" y="18" fill="#e2e8f0" font-weight="600">KAFKA // TERRAFORM</text>
    </g>
  </g>

  <!-- Right Section: Modern Geometric NOVA Emblem & Orbital Astrolabe -->
  <g transform="translate(730, 180)">
    <!-- Radial Soft Glow Aura -->
    <circle cx="0" cy="0" r="85" fill="#38bdf8" fill-opacity="0.12" filter="url(#starBloom)" />

    <!-- Orbital Ring 1 (Precision Cyan Ring) -->
    <g class="ring-1">
      <ellipse cx="0" cy="0" rx="95" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="12 8" opacity="0.8" />
      <circle cx="95" cy="0" r="4" fill="#38bdf8" filter="url(#softLaser)" />
      <circle cx="-95" cy="0" r="3" fill="#ffffff" />
    </g>

    <!-- Orbital Ring 2 (Tilted Indigo Ring) -->
    <g class="ring-2">
      <ellipse cx="0" cy="0" rx="75" ry="75" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.7" />
      <circle cx="0" cy="75" r="4" fill="#818cf8" filter="url(#softLaser)" />
    </g>

    <!-- Center Geometric 4-Point NOVA Supernova Star Emblem -->
    <g class="star-pulsing">
      <!-- Outer Diamond Shield -->
      <polygon points="0,-48 48,0 0,48 -48,0" fill="#0c1527" stroke="url(#iceBlueGrad)" stroke-width="2" filter="url(#softLaser)" />
      <polygon points="0,-32 32,0 0,32 -32,0" fill="#08101d" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" />

      <!-- Center 4-Point Star Core -->
      <path d="M 0 -24 Q 0 0 -24 0 Q 0 0 0 24 Q 0 0 24 0 Q 0 0 0 -24 Z" fill="#ffffff" filter="url(#starBloom)" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
    </g>

    <!-- Precision Crosshairs -->
    <line x1="-110" y1="0" x2="-80" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <line x1="80" y1="0" x2="110" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <line x1="0" y1="-110" x2="0" y2="-80" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <line x1="0" y1="80" x2="0" y2="110" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

    <text x="0" y="118" class="pro-mono" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="middle" letter-spacing="1.5">
      NOVA // CORE EMBLEM
    </text>
  </g>

  <!-- Bottom Right: Precision Frequency & Throughput Meter -->
  <g transform="translate(54, 305)" class="pro-mono">
    <rect x="0" y="0" width="230" height="38" rx="6" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="14" font-size="8.5" fill="#38bdf8" font-weight="700" letter-spacing="1">SYSTEM THROUGHPUT</text>
    <text x="180" y="14" font-size="8.5" fill="#10b981" font-weight="700">ACTIVE</text>

    <!-- Frequency Bars -->
    <g transform="translate(12, 31)">
      <rect x="0" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b1" />
      <rect x="8" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b2" />
      <rect x="16" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b3" />
      <rect x="24" y="-14" width="4.5" height="14" rx="2" fill="#818cf8" class="eq-bar eq-b4" />
      <rect x="32" y="-14" width="4.5" height="14" rx="2" fill="#818cf8" class="eq-bar eq-b5" />
      <rect x="40" y="-14" width="4.5" height="14" rx="2" fill="#818cf8" class="eq-bar eq-b1" />
      <rect x="48" y="-14" width="4.5" height="14" rx="2" fill="#10b981" class="eq-bar eq-b2" />
      <rect x="56" y="-14" width="4.5" height="14" rx="2" fill="#10b981" class="eq-bar eq-b3" />
      <rect x="64" y="-14" width="4.5" height="14" rx="2" fill="#10b981" class="eq-bar eq-b4" />
      <rect x="72" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b5" />
      <rect x="80" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b1" />
      <rect x="88" y="-14" width="4.5" height="14" rx="2" fill="#818cf8" class="eq-bar eq-b2" />
      <rect x="96" y="-14" width="4.5" height="14" rx="2" fill="#818cf8" class="eq-bar eq-b3" />
      <rect x="104" y="-14" width="4.5" height="14" rx="2" fill="#10b981" class="eq-bar eq-b4" />
      <rect x="112" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b5" />
      <rect x="120" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b1" />
      <rect x="128" y="-14" width="4.5" height="14" rx="2" fill="#818cf8" class="eq-bar eq-b2" />
      <rect x="136" y="-14" width="4.5" height="14" rx="2" fill="#10b981" class="eq-bar eq-b3" />
      <rect x="144" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b4" />
      <rect x="152" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b5" />
      <rect x="160" y="-14" width="4.5" height="14" rx="2" fill="#818cf8" class="eq-bar eq-b1" />
      <rect x="168" y="-14" width="4.5" height="14" rx="2" fill="#10b981" class="eq-bar eq-b2" />
      <rect x="176" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b3" />
      <rect x="184" y="-14" width="4.5" height="14" rx="2" fill="#38bdf8" class="eq-bar eq-b4" />
      <rect x="192" y="-14" width="4.5" height="14" rx="2" fill="#818cf8" class="eq-bar eq-b5" />
      <rect x="200" y="-14" width="4.5" height="14" rx="2" fill="#10b981" class="eq-bar eq-b1" />
    </g>
  </g>

  <!-- Fine Corner Precision Brackets -->
  <g stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.8">
    <path d="M 12 28 L 12 12 L 28 12" />
    <path d="M 888 28 L 888 12 L 872 12" />
    <path d="M 12 332 L 12 348 L 28 348" />
    <path d="M 888 332 L 888 348 L 872 348" />
  </g>

  <!-- Scanning Laser Beam -->
  <line x1="14" y1="0" x2="886" y2="0" stroke="url(#iceBlueGrad)" stroke-width="1.5" filter="url(#softLaser)" class="laser-line" />
</svg>
