<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="380">
  <defs>
    <!-- Background Canvas Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0c1836" />
      <stop offset="35%" stop-color="#070e20" />
      <stop offset="70%" stop-color="#040711" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <!-- Hologram & Neon Accent Gradients -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#4facfe" />
      <stop offset="65%" stop-color="#b827fc" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="cyanTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>

    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="streamBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="33%" stop-color="#b827fc" />
      <stop offset="66%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#00ffb3" />
    </linearGradient>

    <!-- Radial Orbs -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </radialGradient>

    <!-- Glow & Bloom Filters -->
    <filter id="ultraBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hexagonal Matrix Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f2fe" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="15" cy="15" r="0.8" fill="#00f2fe" fill-opacity="0.2" />
    </pattern>

    <style>
      @keyframes borderRun {
        0% { stroke-dashoffset: 2600; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes orbitRotate1 {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitRotate2 {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes orbitRotate3 {
        from { transform: rotate(45deg); }
        to { transform: rotate(405deg); }
      }

      @keyframes coreGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px #00f2fe); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 26px #ff007f); }
      }

      @keyframes particleFloat {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-12px) translateX(8px); opacity: 0.9; }
      }

      @keyframes laserScan {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.7; }
        85% { opacity: 0.7; }
        100% { transform: translateY(380px); opacity: 0; }
      }

      @keyframes eqBounce {
        0%, 100% { transform: scaleY(0.2); }
        50% { transform: scaleY(1); }
      }

      @keyframes textShimmer {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6)); }
        50% { filter: drop-shadow(0 0 20px rgba(184, 39, 252, 0.9)) drop-shadow(0 0 35px rgba(255, 0, 127, 0.5)); }
      }

      .animated-border {
        stroke-dasharray: 400 900;
        animation: borderRun 8s linear infinite;
      }
      .orbit-1 { animation: orbitRotate1 12s linear infinite; transform-origin: 730px 190px; }
      .orbit-2 { animation: orbitRotate2 18s linear infinite; transform-origin: 730px 190px; }
      .orbit-3 { animation: orbitRotate3 15s linear infinite; transform-origin: 730px 190px; }
      .holo-core { animation: coreGlow 4s ease-in-out infinite; transform-origin: 730px 190px; }
      .scanner { animation: laserScan 6s linear infinite; }
      .title-shimmer { animation: textShimmer 4s ease-in-out infinite; }

      .p-1 { animation: particleFloat 4s ease-in-out infinite; }
      .p-2 { animation: particleFloat 5.5s ease-in-out infinite 1s; }
      .p-3 { animation: particleFloat 3.8s ease-in-out infinite 2s; }
      .p-4 { animation: particleFloat 6s ease-in-out infinite 1.5s; }

      .eq { transform-origin: bottom; animation: eqBounce 0.8s ease-in-out infinite alternate; }
      .eq-1 { animation-duration: 0.65s; animation-delay: 0.1s; }
      .eq-2 { animation-duration: 0.85s; animation-delay: 0.3s; }
      .eq-3 { animation-duration: 0.55s; animation-delay: 0.05s; }
      .eq-4 { animation-duration: 0.95s; animation-delay: 0.4s; }
      .eq-5 { animation-duration: 0.75s; animation-delay: 0.2s; }
      .eq-6 { animation-duration: 0.60s; animation-delay: 0.35s; }

      .hud-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      }
      .hud-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="380" rx="16" fill="url(#spaceGlow)" stroke="#111c36" stroke-width="1.5" />

  <!-- Ambient Holographic Glow Orbs -->
  <circle cx="730" cy="190" r="240" fill="url(#orbCyan)" />
  <circle cx="200" cy="120" r="260" fill="url(#orbPink)" />

  <!-- Cyber Grid Overlay -->
  <rect width="900" height="380" rx="16" fill="url(#cyberGrid)" />

  <!-- Flowing Neon Frame Running Stream -->
  <rect x="2" y="2" width="896" height="376" rx="15" fill="none" stroke="url(#streamBorder)" stroke-width="2" class="animated-border" filter="url(#softGlow)" />

  <!-- Perspective Cyber Floor Grid (Bottom Horizon) -->
  <g opacity="0.45">
    <line x1="0" y1="315" x2="900" y2="315" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
    <line x1="0" y1="335" x2="900" y2="335" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5" />
    <line x1="0" y1="358" x2="900" y2="358" stroke="#7928ca" stroke-width="1.2" stroke-opacity="0.7" />
    <line x1="450" y1="280" x2="-80" y2="380" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.25" />
    <line x1="450" y1="280" x2="120" y2="380" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
    <line x1="450" y1="280" x2="300" y2="380" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.35" />
    <line x1="450" y1="280" x2="600" y2="380" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.35" />
    <line x1="450" y1="280" x2="780" y2="380" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
    <line x1="450" y1="280" x2="980" y2="380" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.25" />
  </g>

  <!-- Top Glass HUD Telemetry Bar -->
  <g transform="translate(30, 22)" class="hud-mono" font-size="10.5">
    <rect x="0" y="0" width="840" height="34" rx="8" fill="#071022" fill-opacity="0.75" stroke="#16274b" stroke-width="1" />
    
    <!-- Status Beacon -->
    <circle cx="24" cy="17" r="4.5" fill="#00ffb3" filter="url(#softGlow)" />
    <circle cx="24" cy="17" r="8" fill="none" stroke="#00ffb3" stroke-opacity="0.4" />
    <text x="40" y="21" fill="#00ffb3" font-weight="700" letter-spacing="1.2">SYSTEM // HYPERCLOUD ONLINE</text>

    <!-- Telemetry Badges -->
    <text x="320" y="21" fill="#6985ad">LATENCY: <tspan fill="#00f2fe" font-weight="700">0.24ms</tspan></text>
    <text x="470" y="21" fill="#6985ad">AVAILABILITY: <tspan fill="#b827fc" font-weight="700">99.999%</tspan></text>
    <text x="650" y="21" fill="#6985ad">REGION: <tspan fill="#ff007f" font-weight="700">MULTI-AZ CLUSTER</tspan></text>

    <!-- Version Pill -->
    <rect x="765" y="6" width="62" height="22" rx="4" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.5" />
    <text x="778" y="21" fill="#00f2fe" font-weight="700">v5.2.0</text>
  </g>

  <!-- Floating Cyber Particles -->
  <g fill="#00f2fe">
    <circle cx="120" cy="180" r="1.5" class="p-1" opacity="0.6" />
    <circle cx="240" cy="90" r="2" class="p-2" opacity="0.5" fill="#ff007f" />
    <circle cx="480" cy="140" r="1.2" class="p-3" opacity="0.7" fill="#00ffb3" />
    <circle cx="620" cy="80" r="2" class="p-4" opacity="0.6" fill="#b827fc" />
    <circle cx="390" cy="240" r="1.5" class="p-2" opacity="0.5" />
  </g>

  <!-- LEFT SECTION: Cinematic Holographic Typography & Bio -->
  <g transform="translate(50, 92)">
    <!-- Terminal Command Line -->
    <g class="hud-mono" font-size="12.5" letter-spacing="0.8">
      <text x="0" y="16" fill="#7928ca" font-weight="700">sohrab@hypercloud<tspan fill="#4facfe">:~$</tspan> <tspan fill="#00ffb3">./launch_architect.sh</tspan> <tspan fill="#eed5ff">--deploy=production</tspan></text>
    </g>

    <!-- Main Name Title with Glitch Shimmer Bloom -->
    <g class="title-shimmer" transform="translate(0, 72)">
      <text x="0" y="0" class="hud-sans" font-size="46" font-weight="900" letter-spacing="3" fill="url(#neonTitle)">
        SOHRAB DARABI
      </text>
    </g>

    <!-- Sub-Headline: Engineering Specialization -->
    <g transform="translate(0, 106)">
      <text x="0" y="0" class="hud-mono" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="2">
        SENIOR BACKEND &amp; CLOUD DEVOPS ARCHITECT
      </text>
      <text x="0" y="24" class="hud-mono" font-size="12" fill="#88a4ce" letter-spacing="0.6">
        High-Throughput Distributed Microservices // Scalable Cloud Infrastructure // Event-Driven Mesh
      </text>
    </g>

    <!-- Holographic Capsule Tags (Glassmorphism Pills) -->
    <g transform="translate(0, 160)" class="hud-mono" font-size="11">
      <!-- Tag 1: Golang & Distributed -->
      <rect x="0" y="0" width="138" height="28" rx="14" fill="#091429" fill-opacity="0.85" stroke="#00f2fe" stroke-width="1.4" filter="url(#softGlow)" />
      <circle cx="14" cy="14" r="3.5" fill="#00f2fe" />
      <text x="28" y="18" fill="#d2f4ff" font-weight="700">GO // PYTHON</text>

      <!-- Tag 2: Kubernetes & AWS -->
      <rect x="150" y="0" width="158" height="28" rx="14" fill="#130d29" fill-opacity="0.85" stroke="#b827fc" stroke-width="1.4" filter="url(#softGlow)" />
      <circle cx="164" cy="14" r="3.5" fill="#b827fc" />
      <text x="178" y="18" fill="#f2d7ff" font-weight="700">KUBERNETES // AWS</text>

      <!-- Tag 3: Kafka & Terraform -->
      <rect x="320" y="0" width="158" height="28" rx="14" fill="#071b16" fill-opacity="0.85" stroke="#00ffb3" stroke-width="1.4" filter="url(#softGlow)" />
      <circle cx="334" cy="14" r="3.5" fill="#00ffb3" />
      <text x="348" y="18" fill="#d2ffe8" font-weight="700">KAFKA // TERRAFORM</text>
    </g>
  </g>

  <!-- RIGHT SECTION: 3D Isometric Holographic Cloud Sphere & Orbiting Rings -->
  <g transform="translate(730, 190)">
    <!-- Deep Ambient Glow Core -->
    <circle cx="0" cy="0" r="55" fill="url(#orbCyan)" opacity="0.9" />

    <!-- Outer Orbit Ring 1 (Cyan / Tilted) -->
    <g class="orbit-1">
      <ellipse cx="0" cy="0" rx="90" ry="38" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-dasharray="14 8 2 8" opacity="0.85" filter="url(#softGlow)" />
      <!-- Satellite Node on Orbit -->
      <circle cx="90" cy="0" r="4.5" fill="#00f2fe" filter="url(#softGlow)" />
      <circle cx="-90" cy="0" r="3" fill="#00ffb3" />
    </g>

    <!-- Outer Orbit Ring 2 (Purple / Opposing Tilt) -->
    <g class="orbit-2">
      <ellipse cx="0" cy="0" rx="78" ry="78" fill="none" stroke="#b827fc" stroke-width="1.5" stroke-dasharray="10 14" opacity="0.75" filter="url(#softGlow)" />
      <circle cx="0" cy="78" r="4" fill="#ff007f" filter="url(#softGlow)" />
    </g>

    <!-- Outer Orbit Ring 3 (Magenta / Vertical Tilted) -->
    <g class="orbit-3">
      <ellipse cx="0" cy="0" rx="42" ry="94" fill="none" stroke="#ff007f" stroke-width="1.4" stroke-dasharray="18 6" opacity="0.7" />
      <circle cx="0" cy="-94" r="3.5" fill="#ffffff" />
    </g>

    <!-- Central Isometric Holographic Core -->
    <g class="holo-core">
      <!-- Polyhedral Shield -->
      <polygon points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18" fill="#071224" stroke="url(#cyanTealGrad)" stroke-width="2.5" filter="url(#softGlow)" />
      <polygon points="0,-24 22,-12 22,12 0,24 -22,12 -22,-12" fill="#0d1b38" stroke="url(#purplePinkGrad)" stroke-width="1.5" opacity="0.85" />
      
      <!-- Center Cloud / Server Node Icon -->
      <path d="M -12 4 C -15 4 -17 1 -17 -2 C -17 -5 -15 -8 -11 -8 C -10 -13 -5 -16 1 -16 C 7 -16 12 -12 13 -7 C 16 -6 18 -3 18 0 C 18 4 15 7 11 7 Z" fill="#00f2fe" filter="url(#ultraBloom)" opacity="0.95" />
      <circle cx="0" cy="10" r="2.5" fill="#00ffb3" />
    </g>

    <!-- Radar Coordinates Cross -->
    <line x1="-105" y1="0" x2="-82" y2="0" stroke="#00f2fe" stroke-width="1.2" opacity="0.5" />
    <line x1="82" y1="0" x2="105" y2="0" stroke="#00f2fe" stroke-width="1.2" opacity="0.5" />
    <line x1="0" y1="-105" x2="0" y2="-82" stroke="#00f2fe" stroke-width="1.2" opacity="0.5" />
    <line x1="0" y1="82" x2="0" y2="105" stroke="#00f2fe" stroke-width="1.2" opacity="0.5" />
    
    <text x="0" y="118" class="hud-mono" font-size="9" fill="#00f2fe" font-weight="700" text-anchor="middle" letter-spacing="1">HOLO-CORE // v4.2</text>
  </g>

  <!-- BOTTOM HUD: Live Audio Visualizer Equalizer Frequency Spectrum -->
  <g transform="translate(50, 310)" class="hud-mono">
    <!-- Equalizer Enclosure -->
    <rect x="0" y="0" width="220" height="42" rx="6" fill="#060e1f" fill-opacity="0.85" stroke="#16294d" stroke-width="1" />
    <text x="12" y="15" font-size="8.5" fill="#00f2fe" font-weight="700" letter-spacing="0.8">SYSTEM FREQ SPECTRUM</text>
    <text x="175" y="15" font-size="8.5" fill="#00ffb3" font-weight="700">60 FPS</text>

    <!-- Spectrum Bars -->
    <g transform="translate(12, 35)">
      <rect x="0" y="-18" width="5" height="18" rx="2.5" fill="#00f2fe" class="eq eq-1" />
      <rect x="9" y="-18" width="5" height="18" rx="2.5" fill="#00f2fe" class="eq eq-2" />
      <rect x="18" y="-18" width="5" height="18" rx="2.5" fill="#2fe0fe" class="eq eq-3" />
      <rect x="27" y="-18" width="5" height="18" rx="2.5" fill="#4fa8fe" class="eq eq-4" />
      <rect x="36" y="-18" width="5" height="18" rx="2.5" fill="#7928ca" class="eq eq-5" />
      <rect x="45" y="-18" width="5" height="18" rx="2.5" fill="#9d4edd" class="eq eq-6" />
      <rect x="54" y="-18" width="5" height="18" rx="2.5" fill="#b827fc" class="eq eq-2" />
      <rect x="63" y="-18" width="5" height="18" rx="2.5" fill="#ff007f" class="eq eq-1" />
      <rect x="72" y="-18" width="5" height="18" rx="2.5" fill="#ff007f" class="eq eq-4" />
      <rect x="81" y="-18" width="5" height="18" rx="2.5" fill="#00ffb3" class="eq eq-3" />
      <rect x="90" y="-18" width="5" height="18" rx="2.5" fill="#00ffb3" class="eq eq-5" />
      <rect x="99" y="-18" width="5" height="18" rx="2.5" fill="#00f2fe" class="eq eq-2" />
      <rect x="108" y="-18" width="5" height="18" rx="2.5" fill="#00f2fe" class="eq eq-6" />
      <rect x="117" y="-18" width="5" height="18" rx="2.5" fill="#4fa8fe" class="eq eq-1" />
      <rect x="126" y="-18" width="5" height="18" rx="2.5" fill="#b827fc" class="eq eq-4" />
      <rect x="135" y="-18" width="5" height="18" rx="2.5" fill="#ff007f" class="eq eq-3" />
      <rect x="144" y="-18" width="5" height="18" rx="2.5" fill="#00ffb3" class="eq eq-2" />
      <rect x="153" y="-18" width="5" height="18" rx="2.5" fill="#00f2fe" class="eq eq-5" />
      <rect x="162" y="-18" width="5" height="18" rx="2.5" fill="#b827fc" class="eq eq-1" />
      <rect x="171" y="-18" width="5" height="18" rx="2.5" fill="#ff007f" class="eq eq-4" />
      <rect x="180" y="-18" width="5" height="18" rx="2.5" fill="#00ffb3" class="eq eq-6" />
      <rect x="189" y="-18" width="5" height="18" rx="2.5" fill="#00f2fe" class="eq eq-2" />
    </g>
  </g>

  <!-- Corner High-Tech Cyber Brackets -->
  <g stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M 14 34 L 14 14 L 34 14" />
    <path d="M 886 34 L 886 14 L 866 14" />
    <path d="M 14 346 L 14 366 L 34 366" />
    <path d="M 886 346 L 886 366 L 866 366" />
  </g>

  <!-- Animated Laser Scanning Beam -->
  <line x1="16" y1="0" x2="884" y2="0" stroke="url(#neonTitle)" stroke-width="2" filter="url(#ultraBloom)" class="scanner" />
</svg>
