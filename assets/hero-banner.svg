<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360">
  <defs>
    <!-- Matte Luxury Dark Background -->
    <radialGradient id="minimalBg" cx="65%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="40%" stop-color="#0c0e17" />
      <stop offset="85%" stop-color="#07080d" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>

    <!-- Subtle Ambient Aurora Glows -->
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Platinum & Ice Typography Gradient -->
    <linearGradient id="textPlatinum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Smooth Blur Filters -->
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clean Precision Grid Pattern -->
    <pattern id="minimalDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#ffffff" fill-opacity="0.1" />
    </pattern>

    <style>
      @keyframes gyroSpin1 {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes gyroSpin2 {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes coreBreathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px rgba(96, 165, 250, 0.6)); }
      }
      @keyframes pulseBeacon {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.85); opacity: 0.4; }
      }

      .spin-ring-1 {
        animation: gyroSpin1 24s linear infinite;
        transform-origin: 710px 180px;
      }
      .spin-ring-2 {
        animation: gyroSpin2 32s linear infinite;
        transform-origin: 710px 180px;
      }
      .breathe-core {
        animation: coreBreathe 6s ease-in-out infinite;
        transform-origin: 710px 180px;
      }
      .beacon-dot {
        animation: pulseBeacon 2s ease-in-out infinite;
        transform-origin: center;
      }

      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      }
    </style>
  </defs>

  <!-- Canvas Base Frame -->
  <rect width="900" height="360" rx="16" fill="url(#minimalBg)" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Subtle Minimal Dot Grid -->
  <rect width="900" height="360" rx="16" fill="url(#minimalDots)" />

  <!-- Ambient Light Orb Behind Artwork -->
  <circle cx="710" cy="180" r="160" fill="url(#auroraGlow)" />

  <!-- TOP BAR: Clean Minimal Status Bar -->
  <g transform="translate(48, 38)" class="font-mono" font-size="11">
    <!-- Live Status Pill -->
    <rect x="0" y="0" width="186" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#10b981" class="beacon-dot" />
    <text x="26" y="17" fill="#e2e8f0" font-weight="500" letter-spacing="0.4">AVAILABLE FOR ROLES</text>

    <!-- Location & Discipline -->
    <text x="790" y="17" fill="#64748b" text-anchor="end" font-size="10.5">
      DISTRIBUTED SYSTEMS · CLOUD INFRA
    </text>
  </g>

  <!-- LEFT COLUMN: Minimalist Typography & Identity -->
  <g transform="translate(48, 105)">
    <!-- Small Category Eyebrow -->
    <text x="0" y="16" class="font-mono" font-size="11" fill="#60a5fa" font-weight="600" letter-spacing="1.8">
      SOFTWARE ENGINEER &amp; ARCHITECT
    </text>

    <!-- Main Title: Sohrab Darabi -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" class="font-sans" font-size="52" font-weight="800" letter-spacing="-1.5" fill="url(#textPlatinum)">
        Sohrab Darabi
      </text>
    </g>

    <!-- Clean Headline / Statement -->
    <g transform="translate(0, 106)">
      <text x="0" y="0" class="font-sans" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="-0.2">
        Building resilient distributed backends &amp; scalable cloud infrastructure.
      </text>
      <text x="0" y="24" class="font-sans" font-size="13" font-weight="400" fill="#64748b">
        Specializing in high-concurrency services, event streams, and zero-downtime platforms.
      </text>
    </g>

    <!-- Minimalist Clean Tech Badges -->
    <g transform="translate(0, 160)" class="font-mono" font-size="11">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="128" height="28" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0">Go · Python · Rust</text>

      <!-- Badge 2 -->
      <rect x="138" y="0" width="138" height="28" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" transform="translate(138, 0)">Kubernetes · AWS</text>

      <!-- Badge 3 -->
      <rect x="286" y="0" width="138" height="28" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" transform="translate(286, 0)">Kafka · PostgreSQL</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Eye-Catching Minimalist 3D Gyroscopic Sculpture -->
  <g transform="translate(710, 180)">
    <!-- Outer Gyro Ring 1 (Tilted Oval) -->
    <g class="spin-ring-1">
      <ellipse cx="0" cy="0" rx="96" ry="42" fill="none" stroke="url(#ringGrad1)" stroke-width="1.6" stroke-dasharray="16 8 4 8" />
      <circle cx="96" cy="0" r="3.5" fill="#60a5fa" filter="url(#glowSoft)" />
      <circle cx="-96" cy="0" r="2.5" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Outer Gyro Ring 2 (Opposite Tilted Oval) -->
    <g class="spin-ring-2">
      <ellipse cx="0" cy="0" rx="84" ry="84" fill="none" stroke="url(#ringGrad2)" stroke-width="1.2" stroke-dasharray="10 12" />
      <circle cx="0" cy="84" r="3" fill="#c084fc" filter="url(#glowSoft)" />
      <circle cx="0" cy="-84" r="2" fill="#38bdf8" />
    </g>

    <!-- Inner Central Core Sculpture -->
    <g class="breathe-core">
      <!-- Translucent Glass Ring -->
      <circle cx="0" cy="0" r="42" fill="#0f172a" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2" />
      <circle cx="0" cy="0" r="28" fill="#1e293b" fill-opacity="0.6" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1" />

      <!-- Minimalist Monogram / Geometric Star -->
      <path d="M 0 -14 L 4 -4 L 14 0 L 4 4 L 0 14 L -4 4 L -14 0 L -4 -4 Z" fill="#ffffff" filter="url(#coreAura)" />
      <circle cx="0" cy="0" r="2" fill="#3b82f6" />
    </g>

    <!-- Delicate Coordinate Crosshairs -->
    <line x1="-115" y1="0" x2="-100" y2="0" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <line x1="100" y1="0" x2="115" y2="0" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="-115" x2="0" y2="-100" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="100" x2="0" y2="115" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- Delicate Bottom Hairline Divider -->
  <line x1="48" y1="334" x2="852" y2="334" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
</svg>
