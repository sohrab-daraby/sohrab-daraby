<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="430">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="termGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a17" />
      <stop offset="50%" stop-color="#091024" />
      <stop offset="100%" stop-color="#040712" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="tabBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#152445" />
    </linearGradient>

    <!-- Visor Glow Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00ffb3" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="avatarGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter Blooms -->
    <filter id="neonVisorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softTermGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes visorSweep {
        0%, 100% { transform: translateX(-15px); opacity: 0.7; }
        50% { transform: translateX(15px); opacity: 1; filter: drop-shadow(0 0 10px #00ffb3); }
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes lineFadeIn {
        0% { opacity: 0; transform: translateX(-8px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      .cursor { animation: blinkCursor 1s step-end infinite; }
      .visor-light { animation: visorSweep 3s ease-in-out infinite; }
      .mini-radar { animation: radarRotate 4s linear infinite; transform-origin: 120px 375px; }

      .l-1 { animation: lineFadeIn 0.3s ease-out 0.1s both; }
      .l-2 { animation: lineFadeIn 0.3s ease-out 0.2s both; }
      .l-3 { animation: lineFadeIn 0.3s ease-out 0.3s both; }
      .l-4 { animation: lineFadeIn 0.3s ease-out 0.4s both; }
      .l-5 { animation: lineFadeIn 0.3s ease-out 0.5s both; }
      .l-6 { animation: lineFadeIn 0.3s ease-out 0.6s both; }
      .l-7 { animation: lineFadeIn 0.3s ease-out 0.7s both; }
      .l-8 { animation: lineFadeIn 0.3s ease-out 0.8s both; }
      .l-9 { animation: lineFadeIn 0.3s ease-out 0.9s both; }
      .l-10 { animation: lineFadeIn 0.3s ease-out 1.0s both; }
      .l-11 { animation: lineFadeIn 0.3s ease-out 1.1s both; }
      .l-12 { animation: lineFadeIn 0.3s ease-out 1.2s both; }

      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Terminal Window Shell -->
  <rect width="880" height="430" rx="14" fill="url(#termGlassBg)" stroke="#1a2e56" stroke-width="1.6" />

  <!-- Top Tab Bar & Title Area -->
  <path d="M 0 14 C 0 6.26 6.26 0 14 0 L 866 0 C 873.74 0 880 6.26 880 14 L 880 40 L 0 40 Z" fill="url(#tabBarBg)" stroke="#1a2e56" stroke-width="1" />

  <!-- Window Action Buttons (Frosted Neon Dots) -->
  <g transform="translate(20, 20)">
    <circle cx="0" cy="0" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8" />
    <circle cx="20" cy="0" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8" />
    <circle cx="40" cy="0" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.8" />
  </g>

  <!-- Editor Tabs -->
  <g class="code-font" font-size="11">
    <!-- Active Tab 1: architect.go -->
    <path d="M 95 40 L 95 12 C 95 8 98 6 102 6 L 245 6 C 249 6 252 8 252 12 L 252 40 Z" fill="#060a17" stroke="#1a2e56" stroke-width="1" />
    <circle cx="112" cy="23" r="3.5" fill="#00add8" />
    <text x="124" y="27" fill="#ffffff" font-weight="700">architect.go</text>
    <text x="236" y="26" fill="#607b9b">×</text>

    <!-- Inactive Tab 2: cluster.yaml -->
    <text x="278" y="26" fill="#718bb0" font-weight="600">cluster.yaml</text>

    <!-- Inactive Tab 3: telemetry.sh -->
    <text x="390" y="26" fill="#718bb0" font-weight="600">telemetry.sh</text>

    <!-- Right Window Info Tag -->
    <text x="855" y="25" fill="#00ffb3" text-anchor="end" font-size="10.5" font-weight="600">
      ⚡ zsh — git:(main) — UTF-8
    </text>
  </g>

  <!-- LEFT PANE: Holographic Cyber Developer Avatar & Live Node Telemetry -->
  <g transform="translate(26, 56)">
    <!-- Avatar Housing Box -->
    <rect x="0" y="0" width="240" height="350" rx="10" fill="#070d1d" stroke="#182c52" stroke-width="1.2" />

    <!-- Avatar Holographic Frame -->
    <rect x="18" y="16" width="204" height="204" rx="8" fill="url(#avatarGlowGrad)" stroke="#1f3b6c" stroke-width="1" />
    
    <!-- Grid Overlay inside Avatar Frame -->
    <g opacity="0.15" stroke="#00f2fe" stroke-width="0.8">
      <line x1="18" y1="67" x2="222" y2="67" />
      <line x1="18" y1="118" x2="222" y2="118" />
      <line x1="18" y1="169" x2="222" y2="169" />
      <line x1="69" y1="16" x2="69" y2="220" />
      <line x1="120" y1="16" x2="120" y2="220" />
      <line x1="171" y1="16" x2="171" y2="220" />
    </g>

    <!-- Futuristic Cyberpunk Mecha / Developer Helmet Vector Silhouette -->
    <g transform="translate(120, 118)">
      <!-- Head Contour / Cyber Hood -->
      <path d="M 0 -62 C -42 -62 -54 -24 -54 18 C -54 44 -42 58 -28 66 L 28 66 C 42 58 54 44 54 18 C 54 -24 42 -62 0 -62 Z" fill="#0a142c" stroke="#254a85" stroke-width="1.8" />
      
      <!-- Headphone Earcups / Mecha Audio Nodes -->
      <rect x="-62" y="-6" width="12" height="34" rx="4" fill="#0f2246" stroke="#00f2fe" stroke-width="1.2" />
      <rect x="50" y="-6" width="12" height="34" rx="4" fill="#0f2246" stroke="#00f2fe" stroke-width="1.2" />
      <circle cx="-56" cy="11" r="2.5" fill="#ff007f" />
      <circle cx="56" cy="11" r="2.5" fill="#00ffb3" />

      <!-- Glowing Neon Cyber Visor -->
      <polygon points="-36,-10 36,-10 26,16 -26,16" fill="#050a18" stroke="#00f2fe" stroke-width="1.5" />
      <path d="M -30 -4 L 30 -4 L 22 10 L -22 10 Z" fill="url(#visorGrad)" filter="url(#neonVisorGlow)" opacity="0.95" class="visor-light" />

      <!-- Collar / Mecha Neck Plate -->
      <polygon points="-24,42 24,42 36,64 -36,64" fill="#0c1833" stroke="#1f4177" stroke-width="1.2" />
      <!-- Antennas / Circuit Traces on Helmet -->
      <line x1="-28" y1="-50" x2="-44" y2="-28" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.8" />
      <line x1="28" y1="-50" x2="44" y2="-28" stroke="#ff007f" stroke-width="1.2" stroke-opacity="0.8" />
    </g>

    <!-- Cyber ID Tag -->
    <rect x="28" y="196" width="184" height="20" rx="4" fill="#060c18" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" />
    <text x="120" y="210" class="code-font" font-size="9" fill="#00f2fe" font-weight="700" text-anchor="middle" letter-spacing="1">ID: SOHRAB_DARABI // ARCHITECT</text>

    <!-- Mini Telemetry Gauges Below Avatar -->
    <g transform="translate(18, 232)" class="code-font" font-size="8.5">
      <!-- Gauge 1: CPU Efficiency -->
      <text x="0" y="10" fill="#7193c2">CPU EFFICIENCY</text>
      <text x="204" y="10" fill="#00ffb3" text-anchor="end" font-weight="700">99.4%</text>
      <rect x="0" y="16" width="204" height="5" rx="2.5" fill="#0d1830" />
      <rect x="0" y="16" width="186" height="5" rx="2.5" fill="#00ffb3" />

      <!-- Gauge 2: Memory Optimization -->
      <text x="0" y="38" fill="#7193c2">MEMORY OPTIMIZATION</text>
      <text x="204" y="38" fill="#00f2fe" text-anchor="end" font-weight="700">98.8%</text>
      <rect x="0" y="44" width="204" height="5" rx="2.5" fill="#0d1830" />
      <rect x="0" y="44" width="178" height="5" rx="2.5" fill="#00f2fe" />

      <!-- Gauge 3: Network Throughput -->
      <text x="0" y="66" fill="#7193c2">NETWORK I/O</text>
      <text x="204" y="66" fill="#ff007f" text-anchor="end" font-weight="700">40 Gbps</text>
      <rect x="0" y="72" width="204" height="5" rx="2.5" fill="#0d1830" />
      <rect x="0" y="72" width="195" height="5" rx="2.5" fill="#ff007f" />

      <!-- Status Tag -->
      <g transform="translate(0, 92)">
        <circle cx="4" cy="4" r="3.5" fill="#00ffb3" filter="url(#softTermGlow)" />
        <text x="14" y="8" fill="#00ffb3" font-size="9" font-weight="700">K8S CLUSTER: OPTIMAL</text>
        <text x="204" y="8" fill="#728ea8" text-anchor="end">0.2ms ping</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANE: Ultra-Crisp Syntax-Highlighted Architect Code Block & Neofetch -->
  <g transform="translate(286, 56)" class="code-font">
    <!-- Code Editor Area -->
    <rect x="0" y="0" width="568" height="350" rx="10" fill="#070c1a" stroke="#16294c" stroke-width="1.2" />

    <!-- Line Numbers Bar -->
    <g fill="#374f73" font-size="11" text-anchor="end">
      <text x="32" y="28">01</text>
      <text x="32" y="52">02</text>
      <text x="32" y="76">03</text>
      <text x="32" y="100">04</text>
      <text x="32" y="124">05</text>
      <text x="32" y="148">06</text>
      <text x="32" y="172">07</text>
      <text x="32" y="196">08</text>
      <text x="32" y="220">09</text>
      <text x="32" y="244">10</text>
      <text x="32" y="268">11</text>
      <text x="32" y="292">12</text>
      <text x="32" y="316">13</text>
    </g>
    <line x1="42" y1="12" x2="42" y2="338" stroke="#152445" stroke-width="1" />

    <!-- Syntax Highlighted Code Lines -->
    <g transform="translate(54, 0)" font-size="11.8" letter-spacing="0.4">
      <!-- Line 01 -->
      <g transform="translate(0, 28)" class="l-1">
        <text x="0" y="0" fill="#ff007f" font-weight="700">package</text>
        <text x="65" y="0" fill="#ffffff">main</text>
      </g>

      <!-- Line 02 -->
      <g transform="translate(0, 52)" class="l-2">
        <text x="0" y="0" fill="#ff007f" font-weight="700">import</text>
        <text x="55" y="0" fill="#eed5ff">(</text>
        <text x="70" y="0" fill="#00ffb3">"cloud/k8s"</text>
        <text x="160" y="0" fill="#eed5ff">,</text>
        <text x="175" y="0" fill="#00ffb3">"streaming/kafka"</text>
        <text x="315" y="0" fill="#eed5ff">)</text>
      </g>

      <!-- Line 03 -->
      <g transform="translate(0, 76)" class="l-3">
        <text x="0" y="0" fill="#ff007f" font-weight="700">type</text>
        <text x="40" y="0" fill="#00f2fe" font-weight="700">Engineer</text>
        <text x="110" y="0" fill="#ff007f" font-weight="700">struct</text>
        <text x="165" y="0" fill="#eed5ff">{</text>
      </g>

      <!-- Line 04: Name -->
      <g transform="translate(0, 100)" class="l-4">
        <text x="20" y="0" fill="#cbe7ff">Name</text>
        <text x="140" y="0" fill="#ff007f">:</text>
        <text x="160" y="0" fill="#00ffb3" font-weight="700">"Sohrab Darabi"</text>
        <text x="285" y="0" fill="#718bb0">// Sr. Backend &amp; Cloud Architect</text>
      </g>

      <!-- Line 05: Core Focus -->
      <g transform="translate(0, 124)" class="l-5">
        <text x="20" y="0" fill="#cbe7ff">CoreLanguages</text>
        <text x="140" y="0" fill="#ff007f">:</text>
        <text x="160" y="0" fill="#ffd43b">[]string{"Go", "Python", "Rust", "TypeScript"}</text>
      </g>

      <!-- Line 06: Infrastructure -->
      <g transform="translate(0, 148)" class="l-6">
        <text x="20" y="0" fill="#cbe7ff">CloudInfra</text>
        <text x="140" y="0" fill="#ff007f">:</text>
        <text x="160" y="0" fill="#ffd43b">[]string{"Kubernetes", "AWS", "Terraform", "Docker"}</text>
      </g>

      <!-- Line 07: Data & Streaming -->
      <g transform="translate(0, 172)" class="l-7">
        <text x="20" y="0" fill="#cbe7ff">DataMesh</text>
        <text x="140" y="0" fill="#ff007f">:</text>
        <text x="160" y="0" fill="#ffd43b">[]string{"Kafka", "PostgreSQL", "Redis", "gRPC"}</text>
      </g>

      <!-- Line 08: Observability -->
      <g transform="translate(0, 196)" class="l-8">
        <text x="20" y="0" fill="#cbe7ff">Telemetry</text>
        <text x="140" y="0" fill="#ff007f">:</text>
        <text x="160" y="0" fill="#ffd43b">[]string{"Prometheus", "Grafana", "OpenTelemetry"}</text>
      </g>

      <!-- Line 09: System Paradigm -->
      <g transform="translate(0, 220)" class="l-9">
        <text x="20" y="0" fill="#cbe7ff">Architecture</text>
        <text x="140" y="0" fill="#ff007f">:</text>
        <text x="160" y="0" fill="#00f2fe" font-weight="600">"Event-Driven Microservices // Zero-Downtime CI/CD"</text>
      </g>

      <!-- Line 10: Status -->
      <g transform="translate(0, 244)" class="l-10">
        <text x="20" y="0" fill="#cbe7ff">Status</text>
        <text x="140" y="0" fill="#ff007f">:</text>
        <text x="160" y="0" fill="#00ffb3" font-weight="700">"🟢 OPEN TO IMPACTFUL GLOBAL REMOTE ROLES"</text>
      </g>

      <!-- Line 11: End Struct -->
      <g transform="translate(0, 268)" class="l-11">
        <text x="0" y="0" fill="#eed5ff">}</text>
      </g>

      <!-- Line 12: Color Swatches & Terminal Prompt Line -->
      <g transform="translate(0, 298)" class="l-12">
        <rect x="0" y="-8" width="28" height="12" rx="2" fill="#00f2fe" />
        <rect x="34" y="-8" width="28" height="12" rx="2" fill="#00ffb3" />
        <rect x="68" y="-8" width="28" height="12" rx="2" fill="#b827fc" />
        <rect x="102" y="-8" width="28" height="12" rx="2" fill="#ff007f" />
        <rect x="136" y="-8" width="28" height="12" rx="2" fill="#ffd43b" />
        <rect x="170" y="-8" width="28" height="12" rx="2" fill="#ffffff" />

        <!-- Command Prompt with Cursor -->
        <g transform="translate(225, 2)">
          <text x="0" y="0" fill="#00ffb3" font-weight="700">sohrab@k8s:~$</text>
          <text x="120" y="0" fill="#ffffff">go run main.go</text>
          <rect x="238" y="-10" width="8" height="14" fill="#00f2fe" class="cursor" />
        </g>
      </g>
    </g>
  </g>
</svg>
