<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="400">
  <defs>
    <!-- Matte Dark Slate Background -->
    <linearGradient id="bioCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a" />
      <stop offset="50%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#06070b" />
    </linearGradient>

    <!-- Frosted Header Bar -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#1a2030" />
    </linearGradient>

    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="softWhiteBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <filter id="softHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes blinkMinimal { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes fadeUpLine {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .cursor-min { animation: blinkMinimal 1s step-end infinite; }
      .row-fade { animation: fadeUpLine 0.4s ease-out both; }
      
      .f-1 { animation-delay: 0.1s; }
      .f-2 { animation-delay: 0.2s; }
      .f-3 { animation-delay: 0.3s; }
      .f-4 { animation-delay: 0.4s; }
      .f-5 { animation-delay: 0.5s; }
      .f-6 { animation-delay: 0.6s; }
      .f-7 { animation-delay: 0.7s; }
      .f-8 { animation-delay: 0.8s; }
      .f-9 { animation-delay: 0.9s; }
      .f-10 { animation-delay: 1.0s; }

      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      }
      .code-font {
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Base Glass Enclosure -->
  <rect width="880" height="400" rx="14" fill="url(#bioCardBg)" stroke="url(#softWhiteBorder)" stroke-width="1.2" />

  <!-- Studio Header Bar -->
  <path d="M 0 14 C 0 6.26 6.26 0 14 0 L 866 0 C 873.74 0 880 6.26 880 14 L 880 38 L 0 38 Z" fill="url(#headerGrad)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- Window Action Controls -->
  <g transform="translate(20, 19)">
    <circle cx="0" cy="0" r="5.5" fill="#ffffff" fill-opacity="0.18" />
    <circle cx="18" cy="0" r="5.5" fill="#ffffff" fill-opacity="0.18" />
    <circle cx="36" cy="0" r="5.5" fill="#ffffff" fill-opacity="0.18" />
  </g>

  <!-- Header Breadcrumb Tabs -->
  <g class="code-font" font-size="11">
    <rect x="85" y="6" width="168" height="26" rx="6" fill="#0e111a" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="102" cy="19" r="3" fill="#60a5fa" />
    <text x="114" y="23" fill="#f1f5f9" font-weight="600">sohrab_darabi.go</text>

    <!-- Inactive Tab -->
    <text x="275" y="23" fill="#64748b">architecture.md</text>

    <!-- Status Right -->
    <text x="855" y="23" fill="#94a3b8" text-anchor="end" font-size="10.5">
      Go 1.23 · Linux x86_64
    </text>
  </g>

  <!-- LEFT PANE: Minimalist Monogram & Engineering Metrics -->
  <g transform="translate(24, 54)">
    <rect x="0" y="0" width="232" height="326" rx="10" fill="#0b0e17" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

    <!-- Avatar Monogram Box -->
    <g transform="translate(24, 24)">
      <!-- Outer Circle Aura -->
      <circle cx="92" cy="52" r="42" fill="#141b2d" stroke="url(#avatarGlow)" stroke-width="1.8" filter="url(#softHalo)" />
      
      <!-- Monogram Initials: SD -->
      <text x="92" y="60" class="sans-font" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        SD
      </text>
    </g>

    <!-- Name & Role -->
    <g transform="translate(0, 140)" class="sans-font" text-anchor="middle">
      <text x="116" y="0" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="-0.3">
        Sohrab Darabi
      </text>
      <text x="116" y="20" font-size="11.5" font-weight="500" fill="#94a3b8">
        Backend &amp; Cloud Systems
      </text>
    </g>

    <line x1="24" y1="180" x2="208" y2="180" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

    <!-- 3 Key Metric Stats -->
    <g transform="translate(24, 202)" class="sans-font" font-size="9.5">
      <!-- Metric 1 -->
      <text x="0" y="10" fill="#64748b" font-weight="500">AVAILABILITY SLA</text>
      <text x="184" y="10" fill="#10b981" text-anchor="end" font-weight="700">99.99%</text>
      <rect x="0" y="16" width="184" height="4" rx="2" fill="#1e293b" />
      <rect x="0" y="16" width="176" height="4" rx="2" fill="#10b981" />

      <!-- Metric 2 -->
      <text x="0" y="38" fill="#64748b" font-weight="500">LATENCY TARGET</text>
      <text x="184" y="38" fill="#60a5fa" text-anchor="end" font-weight="700">&lt; 1.0 ms</text>
      <rect x="0" y="44" width="184" height="4" rx="2" fill="#1e293b" />
      <rect x="0" y="44" width="168" height="4" rx="2" fill="#60a5fa" />

      <!-- Metric 3 -->
      <text x="0" y="66" fill="#64748b" font-weight="500">CLOUD CLUSTERS</text>
      <text x="184" y="66" fill="#c084fc" text-anchor="end" font-weight="700">Multi-AZ K8s</text>
      <rect x="0" y="72" width="184" height="4" rx="2" fill="#1e293b" />
      <rect x="0" y="72" width="180" height="4" rx="2" fill="#c084fc" />

      <!-- Bottom Status Pill -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="184" height="24" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.25" />
        <circle cx="14" cy="12" r="3" fill="#10b981" />
        <text x="24" y="16" fill="#10b981" font-size="9" font-weight="600">Production Ready</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANE: Modern Minimalist Go Source Code -->
  <g transform="translate(276, 54)" class="code-font">
    <rect x="0" y="0" width="580" height="326" rx="10" fill="#090b12" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

    <!-- Line Numbers -->
    <g fill="#475569" font-size="11" text-anchor="end">
      <text x="32" y="30">01</text>
      <text x="32" y="56">02</text>
      <text x="32" y="82">03</text>
      <text x="32" y="108">04</text>
      <text x="32" y="134">05</text>
      <text x="32" y="160">06</text>
      <text x="32" y="186">07</text>
      <text x="32" y="212">08</text>
      <text x="32" y="238">09</text>
      <text x="32" y="264">10</text>
      <text x="32" y="290">11</text>
    </g>
    <line x1="42" y1="14" x2="42" y2="312" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

    <!-- Code Content -->
    <g transform="translate(54, 0)" font-size="11.8" letter-spacing="0.2">
      <!-- Line 01 -->
      <g transform="translate(0, 30)" class="row-fade f-1">
        <text x="0" y="0" fill="#60a5fa">package</text>
        <text x="65" y="0" fill="#f8fafc">engineer</text>
      </g>

      <!-- Line 02 -->
      <g transform="translate(0, 56)" class="row-fade f-2">
        <text x="0" y="0" fill="#60a5fa">var</text>
        <text x="35" y="0" fill="#f8fafc" font-weight="700">Sohrab</text>
        <text x="90" y="0" fill="#94a3b8">=</text>
        <text x="105" y="0" fill="#60a5fa">&amp;</text>
        <text x="115" y="0" fill="#cbd5e1">Profile</text>
        <text x="165" y="0" fill="#94a3b8">{</text>
      </g>

      <!-- Line 03: Name -->
      <g transform="translate(0, 82)" class="row-fade f-3">
        <text x="20" y="0" fill="#94a3b8">Name:</text>
        <text x="135" y="0" fill="#38bdf8" font-weight="600">"Sohrab Darabi"</text>
        <text x="260" y="0" fill="#475569">// Lead Backend Engineer</text>
      </g>

      <!-- Line 04: Focus -->
      <g transform="translate(0, 108)" class="row-fade f-4">
        <text x="20" y="0" fill="#94a3b8">Specialty:</text>
        <text x="135" y="0" fill="#f1f5f9">"Distributed Microservices &amp; Cloud Infra"</text>
      </g>

      <!-- Line 05: Languages -->
      <g transform="translate(0, 134)" class="row-fade f-5">
        <text x="20" y="0" fill="#94a3b8">Languages:</text>
        <text x="135" y="0" fill="#cbd5e1">[]string{<tspan fill="#38bdf8">"Go"</tspan>, <tspan fill="#38bdf8">"Python"</tspan>, <tspan fill="#38bdf8">"Rust"</tspan>, <tspan fill="#38bdf8">"TypeScript"</tspan>}</text>
      </g>

      <!-- Line 06: Cloud -->
      <g transform="translate(0, 160)" class="row-fade f-6">
        <text x="20" y="0" fill="#94a3b8">CloudOps:</text>
        <text x="135" y="0" fill="#cbd5e1">[]string{<tspan fill="#60a5fa">"Kubernetes"</tspan>, <tspan fill="#60a5fa">"AWS"</tspan>, <tspan fill="#60a5fa">"Terraform"</tspan>, <tspan fill="#60a5fa">"Docker"</tspan>}</text>
      </g>

      <!-- Line 07: Data Tier -->
      <g transform="translate(0, 186)" class="row-fade f-7">
        <text x="20" y="0" fill="#94a3b8">DataMesh:</text>
        <text x="135" y="0" fill="#cbd5e1">[]string{<tspan fill="#10b981">"Apache Kafka"</tspan>, <tspan fill="#10b981">"PostgreSQL"</tspan>, <tspan fill="#10b981">"Redis"</tspan>, <tspan fill="#10b981">"gRPC"</tspan>}</text>
      </g>

      <!-- Line 08: Observability -->
      <g transform="translate(0, 212)" class="row-fade f-8">
        <text x="20" y="0" fill="#94a3b8">Telemetry:</text>
        <text x="135" y="0" fill="#cbd5e1">[]string{<tspan fill="#c084fc">"Prometheus"</tspan>, <tspan fill="#c084fc">"Grafana"</tspan>, <tspan fill="#c084fc">"OpenTelemetry"</tspan>}</text>
      </g>

      <!-- Line 09: Status -->
      <g transform="translate(0, 238)" class="row-fade f-9">
        <text x="20" y="0" fill="#94a3b8">Status:</text>
        <text x="135" y="0" fill="#10b981" font-weight="600">"Open to high-impact engineering opportunities"</text>
      </g>

      <!-- Line 10: Closing Struct -->
      <g transform="translate(0, 264)" class="row-fade f-10">
        <text x="0" y="0" fill="#94a3b8">}</text>
      </g>

      <!-- Line 11: Prompt & Terminal Cursor -->
      <g transform="translate(0, 292)">
        <text x="0" y="0" fill="#64748b">// Build status: passing</text>
        <rect x="180" y="-10" width="7" height="14" fill="#60a5fa" class="cursor-min" />
      </g>
    </g>
  </g>
</svg>
