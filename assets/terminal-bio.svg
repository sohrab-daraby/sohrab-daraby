<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="430">
  <defs>
    <!-- Executive Slate Canvas Background -->
    <linearGradient id="termProBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <!-- Studio Header Bar -->
    <linearGradient id="studioHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="novaStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="proGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes blinkCursorPro { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes novaStarGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.5)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.8)); }
      }
      @keyframes lineSlideIn {
        0% { opacity: 0; transform: translateX(-6px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      .cursor-pro { animation: blinkCursorPro 1s step-end infinite; }
      .star-seal { animation: novaStarGlow 3.5s ease-in-out infinite; transform-origin: 120px 115px; }

      .row-1 { animation: lineSlideIn 0.3s ease-out 0.1s both; }
      .row-2 { animation: lineSlideIn 0.3s ease-out 0.2s both; }
      .row-3 { animation: lineSlideIn 0.3s ease-out 0.3s both; }
      .row-4 { animation: lineSlideIn 0.3s ease-out 0.4s both; }
      .row-5 { animation: lineSlideIn 0.3s ease-out 0.5s both; }
      .row-6 { animation: lineSlideIn 0.3s ease-out 0.6s both; }
      .row-7 { animation: lineSlideIn 0.3s ease-out 0.7s both; }
      .row-8 { animation: lineSlideIn 0.3s ease-out 0.8s both; }
      .row-9 { animation: lineSlideIn 0.3s ease-out 0.9s both; }
      .row-10 { animation: lineSlideIn 0.3s ease-out 1.0s both; }
      .row-11 { animation: lineSlideIn 0.3s ease-out 1.1s both; }
      .row-12 { animation: lineSlideIn 0.3s ease-out 1.2s both; }

      .pro-code {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      .pro-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Enclosure Window Frame -->
  <rect width="880" height="430" rx="14" fill="url(#termProBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Studio Header Titlebar -->
  <path d="M 0 14 C 0 6.26 6.26 0 14 0 L 866 0 C 873.74 0 880 6.26 880 14 L 880 40 L 0 40 Z" fill="url(#studioHeader)" stroke="#1e293b" stroke-width="1" />

  <!-- Action Controls -->
  <g transform="translate(20, 20)">
    <circle cx="0" cy="0" r="6" fill="#ef4444" opacity="0.9" />
    <circle cx="20" cy="0" r="6" fill="#f59e0b" opacity="0.9" />
    <circle cx="40" cy="0" r="6" fill="#10b981" opacity="0.9" />
  </g>

  <!-- Navigation Tabs -->
  <g class="pro-code" font-size="11">
    <path d="M 95 40 L 95 10 C 95 6 98 4 102 4 L 255 4 C 259 4 262 6 262 10 L 262 40 Z" fill="#070b16" stroke="#1e293b" stroke-width="1" />
    <circle cx="112" cy="22" r="3.5" fill="#38bdf8" />
    <text x="124" y="26" fill="#ffffff" font-weight="700">nova_architect.go</text>
    <text x="246" y="25" fill="#64748b">×</text>

    <!-- Inactive Tab -->
    <text x="290" y="25" fill="#64748b" font-weight="600">infrastructure.tf</text>
    <text x="420" y="25" fill="#64748b" font-weight="600">cluster.yaml</text>

    <!-- Right Window Info -->
    <text x="855" y="25" fill="#38bdf8" text-anchor="end" font-size="10.5" font-weight="600">
      ⚡ TEAM NOVA — KUBERNETES v1.30
    </text>
  </g>

  <!-- LEFT PANE: Official NOVA Team Seal & Production Telemetry -->
  <g transform="translate(24, 56)">
    <!-- Seal Housing Box -->
    <rect x="0" y="0" width="244" height="350" rx="10" fill="#090e1c" stroke="#1e293b" stroke-width="1.2" />

    <!-- NOVA Team Emblem Card -->
    <rect x="18" y="18" width="208" height="196" rx="8" fill="#0d1428" stroke="#1f2d48" stroke-width="1" />
    
    <!-- Fine Coordinate Grid Inside Emblem Box -->
    <g opacity="0.12" stroke="#38bdf8" stroke-width="0.8">
      <line x1="18" y1="67" x2="226" y2="67" />
      <line x1="18" y1="116" x2="226" y2="116" />
      <line x1="18" y1="165" x2="226" y2="165" />
      <line x1="70" y1="18" x2="70" y2="214" />
      <line x1="122" y1="18" x2="122" y2="214" />
      <line x1="174" y1="18" x2="174" y2="214" />
    </g>

    <!-- Geometric NOVA Star Seal Emblem -->
    <g class="star-seal" transform="translate(122, 116)">
      <!-- Outer Hexagon / Shield -->
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#0a1224" stroke="url(#novaStarGrad)" stroke-width="2" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 4" />

      <!-- Center 4-Point Nova Starburst -->
      <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z" fill="#ffffff" filter="url(#proGlow)" />
      <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
    </g>

    <!-- Team Badge Tag -->
    <rect x="28" y="178" width="188" height="22" rx="4" fill="#070b16" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="122" y="193" class="pro-title" font-size="10.5" fill="#38bdf8" font-weight="800" text-anchor="middle" letter-spacing="2">
      TEAM NOVA // CLOUD ARCH
    </text>

    <!-- Left Pane Telemetry Metrics -->
    <g transform="translate(18, 230)" class="pro-code" font-size="8.5">
      <!-- Metric 1: System Availability -->
      <text x="0" y="10" fill="#64748b">GLOBAL AVAILABILITY</text>
      <text x="208" y="10" fill="#10b981" text-anchor="end" font-weight="700">99.999%</text>
      <rect x="0" y="16" width="208" height="5" rx="2.5" fill="#0f172a" />
      <rect x="0" y="16" width="202" height="5" rx="2.5" fill="#10b981" />

      <!-- Metric 2: P99 Latency -->
      <text x="0" y="38" fill="#64748b">P99 LATENCY BENCHMARK</text>
      <text x="208" y="38" fill="#38bdf8" text-anchor="end" font-weight="700">&lt; 0.40 ms</text>
      <rect x="0" y="44" width="208" height="5" rx="2.5" fill="#0f172a" />
      <rect x="0" y="44" width="186" height="5" rx="2.5" fill="#38bdf8" />

      <!-- Metric 3: Lead Info -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="208" height="34" rx="4" fill="#0c1326" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="14" fill="#94a3b8" font-size="8">ENGINEER LEAD</text>
        <text x="10" y="27" fill="#ffffff" font-size="9.5" font-weight="700">Sohrab Darabi</text>
        <circle cx="192" cy="17" r="3.5" fill="#10b981" filter="url(#proGlow)" />
      </g>
    </g>
  </g>

  <!-- RIGHT PANE: Modern Syntax-Highlighted Code & Team Specification -->
  <g transform="translate(284, 56)" class="pro-code">
    <!-- Code Editor Box -->
    <rect x="0" y="0" width="572" height="350" rx="10" fill="#080c18" stroke="#1e293b" stroke-width="1.2" />

    <!-- Line Numbers -->
    <g fill="#475569" font-size="11" text-anchor="end">
      <text x="32" y="28">01</text>
      <text x="32" y="52">02</text>
      <text x="32" y="76">03</text>
      <text x="32" y="100">04</text>
      <text x="32" y="124">05</text>
      <text x="32" y="148">06</text>
      <text x="32" y="172">07</text>
      <text x="32" y="196">08</text>
      <text x="32" y="220">09</text>
      <text x="32" y="244">10</text>
      <text x="32" y="268">11</text>
      <text x="32" y="292">12</text>
      <text x="32" y="316">13</text>
    </g>
    <line x1="42" y1="12" x2="42" y2="338" stroke="#1e293b" stroke-width="1" />

    <!-- Syntax Highlighted Lines -->
    <g transform="translate(54, 0)" font-size="11.8" letter-spacing="0.3">
      <!-- Line 01 -->
      <g transform="translate(0, 28)" class="row-1">
        <text x="0" y="0" fill="#818cf8" font-weight="700">package</text>
        <text x="65" y="0" fill="#ffffff">main</text>
      </g>

      <!-- Line 02 -->
      <g transform="translate(0, 52)" class="row-2">
        <text x="0" y="0" fill="#818cf8" font-weight="700">import</text>
        <text x="55" y="0" fill="#94a3b8">(</text>
        <text x="70" y="0" fill="#10b981">"nova/distributed/k8s"</text>
        <text x="270" y="0" fill="#94a3b8">,</text>
        <text x="285" y="0" fill="#10b981">"nova/mesh/kafka"</text>
        <text x="435" y="0" fill="#94a3b8">)</text>
      </g>

      <!-- Line 03 -->
      <g transform="translate(0, 76)" class="row-3">
        <text x="0" y="0" fill="#818cf8" font-weight="700">type</text>
        <text x="40" y="0" fill="#38bdf8" font-weight="700">TeamNova</text>
        <text x="115" y="0" fill="#818cf8" font-weight="700">struct</text>
        <text x="170" y="0" fill="#94a3b8">{</text>
      </g>

      <!-- Line 04: Team -->
      <g transform="translate(0, 100)" class="row-4">
        <text x="20" y="0" fill="#e2e8f0">Team</text>
        <text x="140" y="0" fill="#818cf8">:</text>
        <text x="160" y="0" fill="#38bdf8" font-weight="700">"NOVA"</text>
        <text x="230" y="0" fill="#64748b">// Engineering &amp; High-Scale Architecture</text>
      </g>

      <!-- Line 05: Lead Architect -->
      <g transform="translate(0, 124)" class="row-5">
        <text x="20" y="0" fill="#e2e8f0">LeadArchitect</text>
        <text x="140" y="0" fill="#818cf8">:</text>
        <text x="160" y="0" fill="#10b981" font-weight="700">"Sohrab Darabi"</text>
        <text x="290" y="0" fill="#64748b">// Senior Backend &amp; Cloud DevOps</text>
      </g>

      <!-- Line 06: Core Engines -->
      <g transform="translate(0, 148)" class="row-6">
        <text x="20" y="0" fill="#e2e8f0">CoreEngines</text>
        <text x="140" y="0" fill="#818cf8">:</text>
        <text x="160" y="0" fill="#facc15">[]string{"Go", "Python", "Rust", "TypeScript"}</text>
      </g>

      <!-- Line 07: Cloud & DevOps -->
      <g transform="translate(0, 172)" class="row-7">
        <text x="20" y="0" fill="#e2e8f0">CloudInfra</text>
        <text x="140" y="0" fill="#818cf8">:</text>
        <text x="160" y="0" fill="#facc15">[]string{"Kubernetes", "AWS", "Terraform", "Docker"}</text>
      </g>

      <!-- Line 08: Data & Streaming Mesh -->
      <g transform="translate(0, 196)" class="row-8">
        <text x="20" y="0" fill="#e2e8f0">DataMesh</text>
        <text x="140" y="0" fill="#818cf8">:</text>
        <text x="160" y="0" fill="#facc15">[]string{"Apache Kafka", "PostgreSQL HA", "Redis", "gRPC"}</text>
      </g>

      <!-- Line 09: Telemetry & Observability -->
      <g transform="translate(0, 220)" class="row-9">
        <text x="20" y="0" fill="#e2e8f0">Observability</text>
        <text x="140" y="0" fill="#818cf8">:</text>
        <text x="160" y="0" fill="#38bdf8">[]string{"Prometheus", "Grafana", "OpenTelemetry"}</text>
      </g>

      <!-- Line 10: Status -->
      <g transform="translate(0, 244)" class="row-10">
        <text x="20" y="0" fill="#e2e8f0">Status</text>
        <text x="140" y="0" fill="#818cf8">:</text>
        <text x="160" y="0" fill="#10b981" font-weight="700">"🟢 ALL PRODUCTION CLUSTERS OPERATIONAL"</text>
      </g>

      <!-- Line 11: End Struct -->
      <g transform="translate(0, 268)" class="row-11">
        <text x="0" y="0" fill="#94a3b8">}</text>
      </g>

      <!-- Line 12: Color Swatches & Clean Terminal Prompt -->
      <g transform="translate(0, 298)" class="row-12">
        <rect x="0" y="-8" width="28" height="12" rx="2" fill="#38bdf8" />
        <rect x="34" y="-8" width="28" height="12" rx="2" fill="#10b981" />
        <rect x="68" y="-8" width="28" height="12" rx="2" fill="#818cf8" />
        <rect x="102" y="-8" width="28" height="12" rx="2" fill="#f59e0b" />
        <rect x="136" y="-8" width="28" height="12" rx="2" fill="#e2e8f0" />

        <!-- Command Line -->
        <g transform="translate(195, 2)">
          <text x="0" y="0" fill="#10b981" font-weight="700">nova@cluster:~$</text>
          <text x="145" y="0" fill="#ffffff">go run main.go</text>
          <rect x="268" y="-10" width="8" height="14" fill="#38bdf8" class="cursor-pro" />
        </g>
      </g>
    </g>
  </g>
</svg>
